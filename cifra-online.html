  <script>
/*
 * One source of truth for scales and their shapes on the neck.
 * Used by the Fretboard, the School and the Jam room.
 *
 * A "shape" (or position / box) is where the hand sits: a zone of about
 * 4–5 frets in which you can play every note of the scale across all six
 * strings without moving the hand. Learning the 5 shapes of a scale and how
 * they connect is how guitarists learn to play a scale all over the neck.
 *
 *  - Pentatonic scales (5 notes): the classic 5 "boxes", 2 notes per string.
 *    Box k starts on the k-th note of the scale on the 6th string.
 *  - Blues scale: the minor-pentatonic boxes plus the "blue note" (♭5) where
 *    it falls inside the box.
 *  - 7-note scales: one-finger-per-fret positions. The index finger sits at
 *    the box's first fret (it may stretch one fret back), so each string has
 *    3 (sometimes 2 or 4) notes and the hand never covers more than 5 frets.
 */

const SCALE_LIBRARY = {
  "min-pent": { name: "Minor pentatonic", iv: [0, 3, 5, 7, 10] },
  "maj-pent": { name: "Major pentatonic", iv: [0, 2, 4, 7, 9] },
  "blues": { name: "Blues scale", iv: [0, 3, 5, 6, 7, 10] },
  "major": { name: "Major scale (Ionian)", iv: [0, 2, 4, 5, 7, 9, 11] },
  "minor": { name: "Natural minor (Aeolian)", iv: [0, 2, 3, 5, 7, 8, 10] },
  "harm-minor": { name: "Harmonic minor", iv: [0, 2, 3, 5, 7, 8, 11] },
  "dorian": { name: "Dorian", iv: [0, 2, 3, 5, 7, 9, 10] },
  "mixolydian": { name: "Mixolydian", iv: [0, 2, 4, 5, 7, 9, 10] }
};

// Scale notes from `fromMidi` upwards (inclusive) up to `toMidi`.
function scaleRun(pcs, fromMidi, toMidi) {
  const out = [];
  for (let m = fromMidi; m <= toMidi; m++) if (pcs.includes(pc(m))) out.push(m);
  return out;
}

// Frets on the 6th string where each scale degree sits, starting from the root
// and going up the neck (each anchor = the start of one shape).
function shapeAnchors(rootPc, iv, tuning, maxFret) {
  const rootFret = pc(rootPc - tuning[0]);
  return [...iv].sort((a, b) => a - b).map(i => {
    let f = pc(rootPc + i - tuning[0]);
    if (f < rootFret) f += 12;
    if (f > maxFret - 3) f -= 12;           // keep the whole box on the neck
    return { degree: i, fret: f };
  });
}

/* --- Pentatonic: 2 notes per string from the anchor --- */
function pentBox(pcs, startMidi, tuning, maxFret) {
  const seq = scaleRun(pcs, startMidi, startMidi + 48);
  const cells = [];
  let k = 0;
  for (let s = 0; s < 6 && k < seq.length; s++) {
    let n = 0;
    while (n < 2 && k < seq.length) {
      const f = seq[k] - tuning[s];
      if (f < 0) {
        // too low for this string (open position): it belongs on the string below
        const fp = seq[k] - tuning[s - 1];
        if (s > 0 && fp <= maxFret) cells.push({ s: s - 1, f: fp, m: seq[k] });
        k++; continue;
      }
      if (f > maxFret) break;
      cells.push({ s, f, m: seq[k] }); k++; n++;
    }
  }
  return cells;
}

/* --- 7-note scales: one finger per fret, index at `anchor`, may stretch 1 back --- */
function windowBox(pcs, anchor, tuning, maxFret) {
  // Open position (anchor 0 or 1): open strings + frets 1–4. Otherwise index at
  // the anchor with a one-fret stretch back.
  const lo = anchor <= 1 ? 0 : anchor - 1, hi = Math.min(maxFret, anchor <= 1 ? 4 : anchor + 3);
  let cells = [];
  for (let s = 0; s < 6; s++) {
    for (let f = lo; f <= hi; f++) if (pcs.includes(pc(tuning[s] + f))) cells.push({ s, f, m: tuning[s] + f });
  }
  // The same pitch can appear on two strings (e.g. fret 4 on the B string and
  // fret 9 on the G string). Keep one: the one inside the core frets, else the lower string.
  const byPitch = new Map();
  for (const c of cells) {
    const core = c.f >= anchor && c.f <= anchor + 3;
    const prev = byPitch.get(c.m);
    if (!prev) byPitch.set(c.m, { c, core });
    else if (core && !prev.core) byPitch.set(c.m, { c, core });
  }
  cells = [...byPitch.values()].map(x => x.c);
  // Start the box on the anchor (the 6th-string note), drop lower notes on the 6th string.
  return cells.filter(c => !(c.s === 0 && c.f < anchor && anchor - c.f > 0 && c.m < tuning[0] + anchor));
}

// Fingers per string: one finger per fret from where the index sits (the box's
// first fret, or one fret behind it for a stretch). Fingers always go up along
// a string (1→2→3→4); if the notes are wider than the hand, they are numbered
// in order and the hand stretches or slides.
function assignFingers(cells, kind) {
  // If the whole box fits in 4 frets, the hand doesn't move: number every note
  // from the box's first fret (index finger), on every string.
  const fretted = cells.filter(c => c.f > 0).map(c => c.f);
  const boxLo = Math.min(...fretted), boxHi = Math.max(...fretted);
  const still = kind === "box" && fretted.length && boxHi - boxLo <= 3;
  for (let s = 0; s < 6; s++) {
    const row = cells.filter(c => c.s === s && c.f > 0).sort((a, b) => a.f - b.f);
    if (!row.length) continue;
    const first = row[0].f, last = row[row.length - 1].f;
    const base = still ? boxLo : kind === "window" ? Math.min(first, row[0].box) : first;
    let fg = row.map(c => c.f - base + 1);
    const ok = fg.every((x, i) => x >= 1 && x <= 4 && (i === 0 || x > fg[i - 1]));
    if (!ok) {
      const n = row.length;
      fg = row.map((c, k) => n >= 4 ? Math.min(4, k + 1)
        : n === 3 ? (k === 0 ? 1 : k === 2 ? 4 : (c.f - first <= last - c.f ? 2 : 3))
        : (k === 0 ? 1 : (last - first <= 2 ? 3 : 4)));
    }
    row.forEach((c, i) => { c.finger = fg[i]; });
  }
  cells.forEach(c => { if (c.f === 0) c.finger = 0; });
  return cells;
}

/**
 * All the shapes of a scale, ordered from the root's shape up the neck.
 * Each shape: { n, degree, lo, hi, anchor, cells:[{s,f,m,finger}] }
 */
function scaleShapes(rootPc, iv, tuning = STANDARD_TUNING, maxFret = 15) {
  const sorted = [...iv].sort((a, b) => a - b);
  const pcs = sorted.map(i => pc(rootPc + i));
  const isBlues = sorted.length === 6 && sorted.includes(6) && sorted.includes(3);
  const pentIv = isBlues ? sorted.filter(i => i !== 6) : sorted;
  const pentPcs = pentIv.map(i => pc(rootPc + i));
  const shapes = [];

  if (pentIv.length === 5) {
    for (const a of shapeAnchors(rootPc, pentIv, tuning, maxFret)) {
      let cells = pentBox(pentPcs, tuning[0] + a.fret, tuning, maxFret);
      if (isBlues) {
        // Add the blue note (♭5) in every octave of the box, right after each 4th:
        // on the same string one fret up, or else one fret below the 5th.
        const fourth = pc(rootPc + 5);
        for (const c of [...cells]) {
          if (pc(c.m) !== fourth) continue;
          const m = c.m + 1;
          if (cells.some(x => x.m === m)) continue;
          const five = cells.find(x => x.m === c.m + 2);
          const fr = cells.map(x => x.f), lo = Math.min(...fr), hi = Math.max(...fr);
          if (c.f + 1 <= Math.min(maxFret, hi + 1)) cells.push({ s: c.s, f: c.f + 1, m });   // classic spot
          else if (five && five.f - 1 >= Math.max(0, lo - 1)) cells.push({ s: five.s, f: five.f - 1, m });
        }
      }
      cells.forEach(c => { c.box = a.fret; });
      shapes.push({ degree: a.degree, anchor: a.fret, cells: assignFingers(cells, "box") });
    }
  } else {
    const kept = [];
    for (const a of shapeAnchors(rootPc, sorted, tuning, maxFret)) {
      if (kept.some(k => Math.abs(k - a.fret) < 2)) continue;   // nearly the same hand position
      kept.push(a.fret);
      const cells = windowBox(pcs, a.fret, tuning, maxFret);
      cells.forEach(c => { c.box = a.fret; });
      shapes.push({ degree: a.degree, anchor: a.fret, cells: assignFingers(cells, "window") });
    }
  }
  // Repair: if a scale note is missing between the lowest and highest note of a
  // shape, place it at the nearest fret within one fret of the box.
  shapes.forEach(sh => {
    const ms = sh.cells.map(c => c.m), fr = sh.cells.map(c => c.f);
    const lo = Math.min(...fr), hi = Math.max(...fr);
    let added = false;
    for (const m of scaleRun(pcs, Math.min(...ms), Math.max(...ms))) {
      if (ms.includes(m)) continue;
      let best = null;
      for (let s = 0; s < 6; s++) {
        const f = m - tuning[s];
        if (f < Math.max(0, lo - 1) || f > Math.min(maxFret, hi + 1)) continue;
        const d = f < lo ? lo - f : f > hi ? f - hi : 0;
        if (!best || d < best.d) best = { s, f, d };
      }
      if (best) { sh.cells.push({ s: best.s, f: best.f, m, box: sh.anchor }); added = true; }
    }
    if (added) assignFingers(sh.cells, pentIv.length === 5 ? "box" : "window");
  });
  // Drop shapes that repeat another one (the same box an octave apart wraps to the same frets).
  const seen = new Set();
  for (let i = shapes.length - 1; i >= 0; i--) {
    const sig = shapes[i].cells.map(c => c.s + ":" + c.f).sort().join(" ");
    if (seen.has(sig)) shapes.splice(i, 1); else seen.add(sig);
  }
  shapes.forEach((sh, i) => {
    sh.cells.sort((a, b) => a.m - b.m);
    const fr = sh.cells.map(c => c.f);
    sh.n = i + 1; sh.lo = Math.min(...fr); sh.hi = Math.max(...fr);
  });
  return shapes;
}

/**
 * Across the neck: a "travel route" with every pitch the guitar can play in
 * the scale, each once, climbing diagonally from the open 6th string to the top
 * of the 1st string. Covering ~3 octaves on 6 strings means the hand must slide
 * along some strings (that's what this view teaches); for hand positions that
 * never move, use the shapes.
 */
function acrossNeck(rootPc, iv, tuning = STANDARD_TUNING, maxFret = 15) {
  const pcs = iv.map(i => pc(rootPc + i));
  const seq = scaleRun(pcs, tuning[0], tuning[5] + maxFret);
  const per = Math.ceil(seq.length / 6);
  const cells = [];
  let s = 0, n = 0;
  for (const m of seq) {
    while (s < 5 && (n >= per || m - tuning[s] > maxFret) && m - tuning[s + 1] >= 0) { s++; n = 0; }
    const f = m - tuning[s];
    if (f < 0 || f > maxFret) continue;
    cells.push({ s, f, m });
    n++;
  }
  return assignFingers(cells, "box");
}

/** One octave from the root (the first root on the 6th string), using the root's shape. */
function oneOctave(rootPc, iv, tuning = STANDARD_TUNING, maxFret = 15) {
  const shape = scaleShapes(rootPc, iv, tuning, maxFret)[0];
  const start = tuning[0] + pc(rootPc - tuning[0]);
  return shape.cells.filter(c => c.m >= start && c.m <= start + 12);
}

  <script>
/*
 * Cifra Online School — "Scales for Beginners" learning trail.
 *

/* ---------- Scale shapes (standard tuning) ---------- */

// Scale cells for a lesson view, from the shared js/scales.js:
// "box" = the root's shape (hand position), "octave" = root to root, "neck" = across the neck.
function schoolShape(rootPc, iv, view) {
  const sorted = [...iv].sort((a, b) => a - b);
  if (view === "neck") return acrossNeck(rootPc, sorted);
  if (view === "octave") return oneOctave(rootPc, sorted);
  return scaleShapes(rootPc, sorted)[0].cells;
}

// Finger for each cell (computed by js/scales.js).
function schoolFingers(cells) {
  return new Map(cells.map(c => [c.s + ":" + c.f, c.finger]));
}

/* ---------- Mini neck (display only, tap to hear) ---------- */
function miniNeckHTML(dots, frets = 15, band = null) {
  const rows = [];
  for (let s = 5; s >= 0; s--) {
    const cells = [];
    for (let f = 0; f <= frets; f++) {
      const d = dots.get(s + ":" + f);
      const inBand = band && f > 0 && f >= band[0] && f <= band[1];
      cells.push(`<div class="fb-cell ${f === 0 ? "open" : ""} ${inBand ? "in-band" : ""}" data-s="${s}" data-f="${f}">${d ? `<span class="fb-dot ${d.cls}">${d.label}</span>` : ""}</div>`);
    }
    rows.push(`<div class="fb-row" style="--thick:${(1 + (5 - s) * 0.45).toFixed(2)}px">
      <div class="fb-tune"><span class="fb-note mini">${noteName(STANDARD_TUNING[s], false)}</span></div>
      <div class="fb-strings static">${cells.join("")}</div></div>`);
  }
  const marks = [];
  for (let f = 0; f <= frets; f++) {
    const m = [3, 5, 7, 9, 15].includes(f) ? "●" : f === 12 ? "●●" : "";
    marks.push(`<div class="fb-cell mark"><span>${f}</span><b>${m}</b></div>`);
  }
  rows.push(`<div class="fb-row markers"><div class="fb-tune"></div><div class="fb-strings">${marks.join("")}</div></div>`);
  return `<div class="fb-wrap"><div class="fb mini-neck">${rows.join("")}</div></div>`;
}

/* ---------- Metronome (Web Audio, scheduled ahead for steady timing) ---------- */
const Metronome = (() => {
  let ctx, timer = null, next = 0, beat = 0, bpm = 60, onBeat = null;
  function click(time, accent) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = accent ? 1600 : 1000;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(accent ? 0.5 : 0.3, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    o.connect(g).connect(ctx.destination);
    o.start(time); o.stop(time + 0.07);
  }
  function tick() {
    while (next < ctx.currentTime + 0.12) {
      click(next, beat % 4 === 0);
      const b = beat % 4, delay = (next - ctx.currentTime) * 1000;
      if (onBeat) setTimeout(() => onBeat(b), Math.max(0, delay));
      next += 60 / bpm; beat++;
    }
  }
  return {
    start(newBpm, cb) {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();
      bpm = newBpm; onBeat = cb; beat = 0; next = ctx.currentTime + 0.05;
      clearInterval(timer); timer = setInterval(tick, 25); tick();
    },
    setBpm(b) { bpm = b; },
    stop() { clearInterval(timer); timer = null; },
    get running() { return !!timer; }
  };
})();

/* ---------- Backing track player (gapless loop with Web Audio) ---------- */
const Backing = (() => {
  let ctx, src = null, gain = null, el = null, vol = 0.8;
  const cache = new Map();
  async function load(url) {
    if (cache.has(url)) return cache.get(url);
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const buf = await ctx.decodeAudioData(await res.arrayBuffer());
    cache.set(url, buf);
    return buf;
  }
  function stop() {
    if (src) { try { src.stop(); } catch { /* already stopped */ } src = null; }
    if (el) { el.pause(); el = null; }
  }
  return {
    async play(trackId, keyPc) {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();
      stop();
      const t = TRACKS[trackId];
      const url = `audio/tracks/${trackId}/${KEY_FILES[keyPc]}.mp3`;
      try {
        const buf = await load(url);
        gain = gain || ctx.createGain();
        gain.gain.value = vol;
        gain.connect(ctx.destination);
        src = ctx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        src.loopStart = 0;
        src.loopEnd = Math.min(buf.duration, t.loopSeconds || buf.duration);
        src.connect(gain);
        src.start();
      } catch {
        // file:// pages can't fetch(): fall back to a plain looping <audio> element.
        el = new Audio(url); el.loop = true; el.volume = vol;
        await el.play();
      }
    },
    stop,
    setVolume(v) { vol = v; if (gain) gain.gain.value = v; if (el) el.volume = v; },
    get playing() { return !!(src || el); }
  };
})();

  <script>
/*
 * Jam room: pick a rhythm, a key and a tempo; the backing track loops while the
 * page shows the chord being played, the next chord, and the scale on the neck
 * with the current chord's notes highlighted as "target notes".
 *
 * Tempo changes use WSOLA time-stretching (below), so the key stays the same.
 */

const JAM_SCALES = SCALE_LIBRARY; // shared definitions (js/scales.js)

/*
 * WSOLA (Waveform-Similarity Overlap-Add) time-stretching.
 *
 * Cut the sound into overlapping windowed frames (~46 ms) and lay them down
 * at a FIXED output spacing (Hs), but read them from the input at a spacing of
 * Hs × rate. Reading further apart than we write = shorter = faster, and
 * the pitch is untouched because each frame is played at its normal speed.
 * The trick that avoids a "phasey" sound: before taking each frame, search a
 * small neighbourhood (±tol samples) for the position whose waveform best
 * matches what naturally followed the previous frame (cross-correlation), so
 * the overlapping waves line up instead of cancelling each other out.
 * The loop is treated as circular, so the stretched loop is seamless too.
 */
function wsolaStretch(ctx, buffer, rate) {
  const N = 2048, Hs = 1024, tol = 512, dec = 4;
  const chs = buffer.numberOfChannels, inLen = buffer.length;
  const outLen = Math.round(inLen / rate);
  const input = [...Array(chs)].map((_, c) => buffer.getChannelData(c));
  const mono = new Float32Array(inLen);
  for (let c = 0; c < chs; c++) for (let i = 0; i < inLen; i++) mono[i] += input[c][i] / chs;
  const at = i => mono[((i % inLen) + inLen) % inLen];
  const win = new Float32Array(N);
  for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);

  const out = [...Array(chs)].map(() => new Float32Array(outLen));
  const norm = new Float32Array(outLen);
  const frames = Math.ceil(outLen / Hs);
  let prev = 0;
  for (let k = 0; k < frames; k++) {
    let pos = Math.round(k * Hs * rate);
    if (k > 0) {
      const target = prev + Hs; // where the previous frame "wanted" to continue
      let best = -Infinity, bestPos = pos;
      for (let d = -tol; d <= tol; d += 8) {
        let s = 0;
        for (let i = 0; i < N / 2; i += dec) s += at(target + i) * at(pos + d + i);
        if (s > best) { best = s; bestPos = pos + d; }
      }
      pos = bestPos;
    }
    const o = k * Hs;
    for (let i = 0; i < N; i++) {
      const w = win[i], j = (o + i) % outLen, src = ((pos + i) % inLen + inLen) % inLen;
      for (let c = 0; c < chs; c++) out[c][j] += input[c][src] * w;
      norm[j] += w;
    }
    prev = pos;
  }
  const res = ctx.createBuffer(chs, outLen, buffer.sampleRate);
  for (let c = 0; c < chs; c++) {
    const d = out[c];
    for (let i = 0; i < outLen; i++) d[i] /= norm[i] || 1;
    res.copyToChannel(d, c);
  }
  return res;
}

/* Gapless looping player that knows where it is in the music. */
const JamPlayer = (() => {
  let ctx = null, src = null, gain = null, vol = 0.8;
  let startAt = 0, rate = 1, loopLen = 0, playing = false;
  const decoded = new Map(), stretched = new Map();
  const audio = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());

  async function getBuffer(trackId, keyPc, r) {
    const url = `audio/tracks/${trackId}/${KEY_FILES[keyPc]}.mp3`;
    if (!decoded.has(url)) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      decoded.set(url, await audio().decodeAudioData(await res.arrayBuffer()));
    }
    const base = decoded.get(url);
    // Trim to exactly the loop (whole bars) before stretching.
    const t = TRACKS[trackId];
    const n = Math.min(base.length, Math.round(t.loopSeconds * base.sampleRate));
    const key = url + "@" + r.toFixed(3);
    if (Math.abs(r - 1) < 0.001) {
      if (!stretched.has(key)) {
        const b = audio().createBuffer(base.numberOfChannels, n, base.sampleRate);
        for (let c = 0; c < base.numberOfChannels; c++) b.copyToChannel(base.getChannelData(c).subarray(0, n), c);
        stretched.set(key, b);
      }
      return stretched.get(key);
    }
    if (!stretched.has(key)) {
      const b = audio().createBuffer(base.numberOfChannels, n, base.sampleRate);
      for (let c = 0; c < base.numberOfChannels; c++) b.copyToChannel(base.getChannelData(c).subarray(0, n), c);
      await new Promise(r2 => setTimeout(r2, 0)); // let the UI show "preparing…"
      stretched.set(key, wsolaStretch(audio(), b, r));
    }
    return stretched.get(key);
  }

  return {
    /** Musical position in ORIGINAL-tempo seconds since the loop start (0 … loopSeconds). */
    position() {
      if (!playing) return null;
      const el = (audio().currentTime - startAt - (ctx.outputLatency || ctx.baseLatency || 0)) % loopLen;
      return ((el + loopLen) % loopLen) * rate;
    },
    async play(trackId, keyPc, r, fromMusicalSec = 0) {
      await audio().resume();
      const buf = await getBuffer(trackId, keyPc, r);
      this.stop();
      gain = gain || ctx.createGain();
      gain.gain.value = vol;
      gain.connect(ctx.destination);
      src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      src.connect(gain);
      rate = r;
      loopLen = buf.duration;
      const offset = (fromMusicalSec / r) % loopLen;
      startAt = ctx.currentTime + 0.03 - offset;
      src.start(ctx.currentTime + 0.03, offset);
      playing = true;
    },
    stop() {
      if (src) { try { src.stop(); } catch { /* ok */ } src.disconnect(); src = null; }
      playing = false;
    },
    setVolume(v) { vol = v; if (gain) gain.gain.value = v; },
    get playing() { return playing; }
  };
})();

        <span class="song-meta" id="jamBar"></span>
      </div>
      <div class="jam-next"><span class="tool-label">Next</span><div class="jam-chord small" id="jamNext">—</div></div>
      <div class="jam-diagram" id="jamDiagram"></div>
      <label class="tool vol"><span class="tool-label">Vol</span><input type="range" id="jamVol" min="0" max="1" step="0.05" value="0.8"></label>
    </section>
    <div class="jam-strip" id="jamStrip"></div>
    <p class="hint" id="jamStatus"></p>

    <section class="panel">
      <div class="neck-tools">
        <div class="chips">${[["neck", "Across the neck"], ["box", "One position"], ["shapes", "Shapes"]].map(([v, t]) => `<button class="chip" data-view="${v}">${t}</button>`).join("")}</div>
        <div class="chips">${[["names", "Note names"], ["intervals", "Intervals"], ["fingers", "Fingers ✋"]].map(([v, t]) => `<button class="chip" data-lab="${v}">${t}</button>`).join("")}</div>
      </div>
      <div id="jamShapes"></div>
      <div id="jamNeck"></div>
      <div class="fb-legend" id="jamLegend"></div>
    </section>
  `;

  const T = () => TRACKS[st.track];
  const shift = () => pc(st.key - T().root);
  const keyFlats = () => keyUsesFlats(transposeKey(ROOT_NAMES[T().root] + (T().mode === "minor" ? "m" : ""), shift()));
  const chordAt = bar => {
    const t = T(), p = t.prog;
    const name = p[((bar % p.length) + p.length) % p.length];
    return transposeChord(name, shift(), keyFlats());
  };
  const prettyChord = c => c.replace("#", "♯").replace(/([A-G])b/, "$1♭");
  const scaleFor = () => (T().scales.includes(st.scale) ? st.scale : T().scales[0]);

  function drawControls() {
    $("#jamTracks").innerHTML = ids.map(id => {
      const t = TRACKS[id];
      return `<button class="chip ${id === st.track ? "on" : ""}" data-track="${id}" title="${t.style}">${t.title} <small>${Math.round(t.bpm)}</small></button>`;
    }).join("");
    const minor = T().mode === "minor";
    $("#jamKeys").innerHTML = ROOT_NAMES.map((n, i) => `<button class="chip ${i === st.key ? "on" : ""}" data-key="${i}">${pretty(n)}${minor ? "m" : ""}</button>`).join("") +
      `<button class="chip" id="jamRandom" title="Random key">🎲</button>`;
    $("#jamTempo").value = st.tempo;
    $("#jamBpm").textContent = `${Math.round(T().bpm * st.tempo)} BPM`;
    const sc = scaleFor();
    $("#jamScales").innerHTML = T().scales.map((id, i) => `<button class="chip ${id === sc ? "on" : ""}" data-scale="${id}">${JAM_SCALES[id].name}${i === 0 ? " ★" : ""}</button>`).join("");
    document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === st.view));
    document.querySelectorAll("[data-lab]").forEach(b => b.classList.toggle("on", b.dataset.lab === st.labels));
    // whole progression strip
    const p = T().prog;
    $("#jamStrip").innerHTML = p.map((_, i) => `<span class="jam-bar" data-bar="${i}">${prettyChord(chordAt(i))}</span>`).join("");
    $("#jamStatus").innerHTML = `${T().title} · ${T().style}. Key of <strong>${pretty(ROOT_NAMES[st.key])}${minor ? " minor" : " major"}</strong> — ★ marks the scale that fits best.`;
  }

  function drawNeck(currentChord) {
    const sc = JAM_SCALES[scaleFor()];
    const root = st.key;
    const iv = [...sc.iv].sort((a, b) => a - b);
    const spell = spellSet(root, iv, false);
    const chordPcs = currentChord ? chordTones(currentChord) : [];
    const dots = new Map();
    let cells, inShape = null, band = null;
    if (st.view === "neck") cells = acrossNeck(root, iv);
    else {
      const shapes = scaleShapes(root, iv);
      const idx = st.view === "box" ? 0 : Math.min(st.shape, shapes.length - 1);
      const sel = shapes[idx];
      band = [sel.lo, sel.hi];
      if (st.view === "box") cells = sel.cells;
      else {
        // Shapes: every scale note on the neck, the selected hand position in front.
        const own = new Set(sel.cells.map(c => c.s + ":" + c.f));
        inShape = k => own.has(k);
        cells = [...sel.cells];
        for (let s = 0; s < 6; s++) for (let f = 0; f <= 15; f++) {
          const m = STANDARD_TUNING[s] + f;
          if (iv.some(i => pc(root + i) === pc(m)) && !own.has(s + ":" + f)) cells.push({ s, f, m, finger: null });
        }
      }
      $("#jamShapes").innerHTML = st.view === "shapes" ? `
        <div class="fb-pos"><span class="tool-label">Shape</span>
          <button class="chip" data-jshape="prev">◀</button>
          ${shapes.map((sh, i) => `<button class="chip ${i === idx ? "on" : ""}" data-jshape="${i}">${sh.n} <small>fr ${sh.lo}–${sh.hi}</small></button>`).join("")}
          <button class="chip" data-jshape="next">▶</button></div>
        <p class="hint">✋ Hand on frets <strong>${sel.lo}–${sel.hi}</strong> (the highlighted band). Faded notes belong to the neighbouring shapes.</p>` : "";
    }
    if (st.view !== "shapes") $("#jamShapes").innerHTML = "";
    cells.forEach(c => {
      const k = c.s + ":" + c.f;
      const i = pc(c.m - root);
      const mine = !inShape || inShape(k);
      const label = st.labels === "fingers" && mine && c.finger !== null ? String(c.finger)
        : st.labels === "intervals" ? SCALE_INTERVALS[i] : spell.get(pc(c.m));
      const target = chordPcs.includes(pc(c.m));
      let cls = "role-" + intervalRole(i);
      if (!mine) cls += " faded";
      else if (target) cls += " target";
      else if (chordPcs.length) cls += " dim";
      if (st.labels === "fingers" && mine) cls += " finger";
      dots.set(k, { label, cls });
    });
    $("#jamNeck").innerHTML = miniNeckHTML(dots, 15, band);
    const chordNotes = currentChord ? chordPcs.map(p => spell.get(p) || noteName(p, keyFlats())).join(" · ") : "";
    $("#jamLegend").innerHTML = `<span class="legend-title"><strong>${spell.get(root)} ${sc.name}</strong>: ${iv.map(i => spell.get(pc(root + i))).join(" · ")}</span>
      <span><i class="fb-dot role-root target"></i> <strong>Target notes</strong> — the notes of the chord playing now${currentChord ? ` (${prettyChord(currentChord)} = ${chordNotes})` : ""}.
      Landing on them sounds strong and "in tune with the band"; the other scale notes (dimmer) are passing notes that move you between targets.</span>`;
  }

  function chordTones(name) {
    const p = parseChord(name);
    if (!p) return [];
    const ivs = { "": [0, 4, 7], m: [0, 3, 7], "7": [0, 4, 7, 10], m7: [0, 3, 7, 10], maj7: [0, 4, 7, 11] }[p.suffix] || [0, 4, 7];
    return ivs.map(i => pc(noteIndex(p.root) + i));
  }

  function showChord(bar) {
    const now = chordAt(bar), next = chordAt(bar + 1);
    $("#jamNow").textContent = prettyChord(now);
    $("#jamNext").textContent = prettyChord(next);
    $("#jamDiagram").innerHTML = chordDiagramSVG(now, { lefty: prefs.lefty });
    const p = T().prog.length;
    $("#jamBar").textContent = `Bar ${(bar % p) + 1} of ${p}`;
    document.querySelectorAll(".jam-bar").forEach(el => el.classList.toggle("on", +el.dataset.bar === bar % p));
    drawNeck(now);
  }

  function tick() {
    const pos = JamPlayer.position();
    if (pos !== null) {
      const beatLen = 60 / T().bpm;
      const beat = Math.floor(pos / beatLen);
      const bar = Math.floor(beat / 4) % T().loopBars;
      if (bar !== lastBar) { lastBar = bar; showChord(bar); }
      if (beat !== lastBeat) {
        lastBeat = beat;
        document.querySelectorAll("#jamBeats i").forEach((x, i) => x.className = i === beat % 4 ? "on" : "");
      }
    }
    raf = requestAnimationFrame(tick);
  }

  async function start(fromPos = 0) {
    $("#jamPlay").textContent = "…";
    const needsStretch = Math.abs(st.tempo - 1) > 0.001;
    if (needsStretch) $("#jamStatus").textContent = "Preparing the new tempo…";
    try {
      await JamPlayer.play(st.track, st.key, st.tempo, fromPos);
    } catch (e) {
      $("#jamStatus").textContent = "Could not load the backing track (open the site through a web server, not as a local file).";
    }
    $("#jamPlay").textContent = JamPlayer.playing ? "❚❚" : "▶";
    drawControls();
    lastBar = -1; lastBeat = -1;
  }
  // Change something while playing: restart at the same musical position.
  async function restart(keepPos = true) {
    if (!JamPlayer.playing) { drawControls(); showChord(0); return; }
    const t = TRACKS[st.track];
    const pos = keepPos ? (JamPlayer.position() || 0) % t.loopSeconds : 0;
    await start(pos);
  }

  /* events */
  $("#jamPlay").onclick = () => {
    if (JamPlayer.playing) { JamPlayer.stop(); $("#jamPlay").textContent = "▶"; document.querySelectorAll("#jamBeats i").forEach(x => x.className = ""); return; }
    start(0);
  };
  app.addEventListener("click", onClick);
  function onClick(e) {
    const b = e.target.closest("[data-track],[data-key],[data-scale],[data-view],[data-lab],[data-jshape],#jamRandom,#jamTempoReset");
    if (!b) return;
    if (b.dataset.jshape) {
      const n = scaleShapes(st.key, JAM_SCALES[scaleFor()].iv).length, v = b.dataset.jshape;
      st.shape = v === "prev" ? (st.shape + n - 1) % n : v === "next" ? (st.shape + 1) % n : +v;
      save(); drawNeck(JamPlayer.playing ? chordAt(lastBar) : chordAt(0)); return;
    }
    if (b.dataset.track) { st.track = b.dataset.track; save(); restart(false); return; }
    if (b.dataset.key) { st.key = +b.dataset.key; save(); restart(); return; }
    if (b.id === "jamRandom") { st.key = Math.floor(Math.random() * 12); save(); restart(); return; }
    if (b.id === "jamTempoReset") { st.tempo = 1; save(); restart(); return; }
    if (b.dataset.scale) { st.scale = b.dataset.scale; st.shape = 0; save(); drawControls(); drawNeck(JamPlayer.playing ? chordAt(lastBar) : chordAt(0)); return; }
    if (b.dataset.view) { st.view = b.dataset.view; save(); drawControls(); drawNeck(JamPlayer.playing ? chordAt(lastBar) : chordAt(0)); return; }
    if (b.dataset.lab) { st.labels = b.dataset.lab; save(); drawControls(); drawNeck(JamPlayer.playing ? chordAt(lastBar) : chordAt(0)); }
  }
  $("#jamTempo").oninput = e => { st.tempo = +e.target.value; $("#jamBpm").textContent = `${Math.round(T().bpm * st.tempo)} BPM`; };
  $("#jamTempo").onchange = () => { save(); restart(); };
  $("#jamVol").oninput = e => JamPlayer.setVolume(+e.target.value);
  $("#jamNeck").addEventListener("click", e => {
    const c = e.target.closest(".fb-cell[data-s]");
    if (c) GuitarAudio.playMidi(STANDARD_TUNING[+c.dataset.s] + +c.dataset.f);
  });

  cleanup = () => { JamPlayer.stop(); cancelAnimationFrame(raf); app.removeEventListener("click", onClick); };
  drawControls(); showChord(0);
  raf = requestAnimationFrame(tick);
}

</script>
  <script>
/* Cifra Online — single-page app with hash routing. No build step needed. */

const $ = (sel, el = document) => el.querySelector(sel);
const app = $("#app");

const store = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem("cifra:" + key);
      return v === null ? fallback : JSON.parse(v);
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("cifra:" + key, JSON.stringify(value)); } catch { /* ignore */ }
  }
};

const LEVELS = { 1: "Beginner", 2: "Easy", 3: "Intermediate" };
const EASY_KEYS = ["C", "G", "D", "A", "E", "Am", "Em", "Dm"];

const prefs = {
  lefty: store.get("lefty", false),
  fontSize: store.get("fontSize", 18),
  showDiagrams: store.get("showDiagrams", true)
};

let scrollTimer = null;
function stopAutoScroll() {
  if (scrollTimer) cancelAnimationFrame(scrollTimer);
  scrollTimer = null;
}

/* ---------- Helpers ---------- */

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setActiveNav(route) {
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("active", a.dataset.route === route));
}

/* ---------- Chord library ---------- */

function renderChords() {
  setActiveNav("chords");
  document.title = "Chord library — Cifra Online";
  const groups = {
    "Major": ["C", "D", "E", "F", "G", "A", "Bb"],
    "Minor": ["Am", "Bm", "Dm", "Em"],
    "Seventh (7)": ["A7", "B7", "C7", "D7", "E7", "G7"],
    "Minor seventh (m7)": ["Am7", "Dm7", "Em7", "F#m7"]
  };
  app.innerHTML = `
    <h1>Chord library</h1>
    <p class="lead">Every chord used on this site, in beginner-friendly shapes. Tap a chord to hear it.</p>
    <div class="legend">
      <span><b class="dot-sample"></b> press here (number = finger: 1 index, 2 middle, 3 ring, 4 pinky)</span>
      <span><b class="open-sample"></b> play the open string</span>
      <span><b>×</b> don't play this string</span>
    </div>
    ${Object.entries(groups).map(([g, list]) => `
      <h2>${g}</h2>
      <div class="diagrams big">${list.map(c => `
        <button class="diagram-card" data-chord="${c}">
          <span class="diagram-name">${c}</span>
          ${chordDiagramSVG(c, { lefty: prefs.lefty })}
          ${CHORD_LIBRARY[c].note ? `<small>${CHORD_LIBRARY[c].note}</small>` : ""}
        </button>`).join("")}
      </div>`).join("")}
  `;
  const onClick = e => {
    const b = e.target.closest("[data-chord]");
    if (b) GuitarAudio.strum(getFingering(b.dataset.chord).frets);
  };
  app.addEventListener("click", onClick);
  cleanup = () => app.removeEventListener("click", onClick);
}

/* ---------- Learn ---------- */

function renderLearn() {
  setActiveNav("learn");
  document.title = "Start here — Cifra Online";
  app.innerHTML = `
    <h1>Start here</h1>
    <p class="lead">Five things to know before your first lesson.</p>

    <section class="learn-card">
      <h2>1. Tune your guitar</h2>
      <p>Standard tuning, from the thickest string to the thinnest: <strong>E A D G B E</strong>. Tap a string to hear its reference note and tune until they match.</p>
      <div class="tuner">${OPEN_STRINGS.map((s, i) => `
        <button class="string-btn" data-string="${i}"><b>${s.name}<sub>${s.octave}</sub></b><small>${s.freq.toFixed(1)} Hz</small></button>`).join("")}
      </div>
      <p class="hint">Each string is 5 frets (semitones) above the previous one — except G→B, which is 4. That's why the 5th-fret tuning trick works.</p>
      <p><a class="btn" href="#/tuner">Open the Fretboard &amp; Tuner →</a> to try other tunings and see what they change.</p>
    </section>

    <section class="learn-card">
      <h2>2. Read a chord diagram</h2>
      <div class="learn-row">
        <div class="diagram-card static">${chordDiagramSVG("C")}</div>
        <ul>
          <li>Vertical lines are the <strong>strings</strong> (thick low E on the left).</li>
          <li>Horizontal lines are the <strong>frets</strong>; the thick bar at the top is the nut.</li>
          <li>Dots show where to press; the number is the <strong>finger</strong>.</li>
          <li><strong>○</strong> = play open, <strong>×</strong> = don't play.</li>
        </ul>
      </div>
    </section>

    <section class="learn-card">
      <h2>3. Read a chord chart</h2>
      <div class="bars demo"><span class="bar"><span class="chord">C</span></span><span class="bar"><span class="chord">G</span></span><span class="bar"><span class="chord">Am</span><span class="chord">F</span></span></div>
      <p>Each box is one <strong>bar</strong> (4 beats). Two chords in one box share it: 2 beats each. <span class="repeat">×2</span> means play the section twice.</p>
    </section>

    <section class="learn-card">
      <h2>4. Strumming</h2>
      <p>Count <strong>1 &amp; 2 &amp; 3 &amp; 4 &amp;</strong>. Your hand goes <strong>down on the numbers</strong> and <strong>up on the “&amp;”</strong> — always, like a pendulum. A pattern just tells you which swings actually hit the strings.</p>
      <p>Start with all down-strums (<code>↓ · ↓ · ↓ · ↓ ·</code>), then try the most common pattern in pop: <code>↓ · ↓ ↑ · ↑ ↓ ↑</code>.</p>
    </section>

    <section class="learn-card">
      <h2>5. Capo &amp; changing key</h2>
      <p>A capo clamps all strings at one fret — like a moveable nut. Each fret raises the pitch by one <strong>semitone</strong>, so you can play easy shapes (C, G, D…) and still match the record.</p>
      <p>In the school's backing-track player you can pick any key: the track is pitch-shifted and the scale on the neck moves with it.</p>
    </section>

    <p><a class="btn primary" href="#/">Start the course: Scales for Beginners →</a></p>
  `;
  const onClick = e => {
    const b = e.target.closest("[data-string]");
    if (b) GuitarAudio.playString(Number(b.dataset.string));
  };
  app.addEventListener("click", onClick);
  cleanup = () => app.removeEventListener("click", onClick);
}

function renderNotFound() {
  app.innerHTML = `<h1>Page not found</h1><p><a href="#/">Back to the school</a></p>`;
}

/* ---------- Router ---------- */

let cleanup = () => {};
function route() {
  cleanup(); cleanup = () => {};
  const hash = location.hash.replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);
  if (parts.length === 0 || parts[0] === "school") renderSchool();
  else if (parts[0] === "lesson" && parts[1]) renderLesson(parts[1]);
  else if (parts[0] === "jam") renderJam();
  else if (parts[0] === "chords") renderChords();
  else if (parts[0] === "tuner") renderTuner();
  else if (parts[0] === "learn") renderLearn();
  else renderNotFound();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();

</script>
</body>
</html>
