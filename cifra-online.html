<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cifra Online School — guitar scales for beginners</title>
  <meta name="description" content="Learn guitar scales step by step: lessons, an interactive fretboard and backing tracks in every key.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
  <style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --text: #1f2328;
  --muted: #667085;
  --border: #e4e2dc;
  --accent: #0f766e;
  --accent-soft: #e0f2ef;
  --chord: #c2410c;
  --chord-soft: #fff1e8;
  --top: #134e4a;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111416;
    --surface: #1a1f22;
    --text: #e8eaeb;
    --muted: #98a2ab;
    --border: #2b3236;
    --accent: #2dd4bf;
    --accent-soft: #123a36;
    --chord: #fb923c;
    --chord-soft: #3a2418;
    --top: #0b2b29;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
a { color: var(--accent); }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: .2em 0; line-height: 1.15; }
h2 { font-size: 1.15rem; margin: 1.4em 0 .6em; }
code { background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; }

.container { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }

/* Top bar */
.topbar { background: var(--top); color: #fff; position: sticky; top: 0; z-index: 10; }
.topbar-inner { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.logo { color: #fff; text-decoration: none; font-size: 1.3rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.logo b { color: #5eead4; }
.logo-mark { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #5eead4; color: var(--top); font-weight: 700; }
.nav { display: flex; gap: 4px; }
.nav a { color: #d1fae5; text-decoration: none; padding: 6px 12px; border-radius: 999px; font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.1); }
.nav a.active { background: #fff; color: var(--top); }

/* Hero / home */
.hero { background: linear-gradient(135deg, var(--accent-soft), transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 20px; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; color: var(--muted); margin: 0; }
.lead { color: var(--muted); font-size: 1.05rem; max-width: 60ch; }
.stats { margin: 0; }

.filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
#search { width: 100%; padding: 12px 14px; font-size: 1rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
#search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: .9rem; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.song-list { display: grid; gap: 10px; }
.song-card { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; text-decoration: none; color: inherit; box-shadow: var(--shadow); transition: transform .1s, border-color .1s; }
.song-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.rank { font-size: 1.4rem; font-weight: 700; color: var(--muted); width: 1.6em; text-align: center; flex: none; }
.song-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.song-title { font-weight: 650; font-size: 1.1rem; }
.song-meta { color: var(--muted); font-size: .9rem; }
.star { color: #eab308; }
.chord-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: .78rem; font-weight: 600; color: var(--chord); background: var(--chord-soft); padding: 1px 8px; border-radius: 6px; }
.empty { color: var(--muted); text-align: center; padding: 40px; }

.level { display: inline-flex; align-items: center; gap: 3px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
.level i { width: 8px; height: 8px; border-radius: 50%; background: var(--border); display: inline-block; }
.level i.on { background: var(--accent); }
.level span { margin-left: 4px; }

/* Song page */
.crumbs { font-size: .9rem; color: var(--muted); }
.crumbs a { text-decoration: none; }
.song-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
.song-artist { margin: 0; color: var(--muted); font-size: 1.05rem; }
.song-facts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; color: var(--muted); font-size: .9rem; margin: 8px 0 0; }
.icon-btn { font-size: 1.6rem; background: none; border: 1px solid var(--border); border-radius: 50%; width: 48px; height: 48px; cursor: pointer; color: var(--border); flex: none; }
.icon-btn.on { color: #eab308; border-color: #eab308; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; position: sticky; top: 56px; z-index: 5; box-shadow: var(--shadow); }
.tool { display: flex; align-items: center; gap: 6px; }
.tool-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.key-name { min-width: 3.2em; text-align: center; color: var(--chord); font-size: 1.05rem; }
.btn { font: inherit; font-size: .9rem; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); padding: 10px 18px; }
.btn.small { padding: 4px 10px; font-size: .85rem; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: .9rem; cursor: pointer; }
#speed { width: 90px; accent-color: var(--accent); }

.sounding { color: var(--muted); margin: 14px 2px; }
.sounding strong { color: var(--text); }
.callout { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; }

.song-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 860px) {
  .song-layout { grid-template-columns: 1fr; }
  .sidebar { order: -1; }
  .toolbar { position: static; }
}

.sheet { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 22px 22px; box-shadow: var(--shadow); }
.section h3 { font-size: .8em; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 1.4em 0 .5em; display: flex; align-items: center; gap: 8px; }
.repeat { font-size: .85em; background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 999px; letter-spacing: 0; font-weight: 700; }
.bars { display: flex; flex-wrap: wrap; margin-bottom: 8px; border-left: 3px solid var(--text); }
.bar { flex: 1 0 5.5em; display: flex; gap: .4em; align-items: center; padding: .45em .6em; border-right: 1px solid var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 2.6em; }
.bars .bar:last-child { border-right: 3px solid var(--text); }
.chord { font: inherit; font-weight: 700; color: var(--chord); background: none; border: none; padding: 2px 4px; border-radius: 6px; cursor: pointer; }
.chord:hover { background: var(--chord-soft); }
.flash { animation: flash .5s; }
@keyframes flash { from { background: var(--chord); color: #fff; } to { background: transparent; } }
.note { font-size: .8em; color: var(--muted); font-style: italic; margin: 4px 0 0; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 16px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.panel h2 small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.diagrams { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.diagrams.big { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.diagram-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 6px 4px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: var(--text); font: inherit; }
.diagram-card:hover { border-color: var(--chord); }
.diagram-card.static { cursor: default; width: 130px; flex: none; }
.diagram-card small { color: var(--muted); font-size: .72rem; padding-bottom: 4px; text-align: center; }
.diagram-name { font-weight: 700; color: var(--chord); }
.diagram { width: 100%; max-width: 120px; }
.diagram .fret, .diagram .string { stroke: var(--muted); stroke-width: 1; }
.diagram .nut { fill: var(--text); }
.diagram .dot { fill: var(--text); }
.diagram .finger { fill: var(--surface); font-size: 9px; font-weight: 700; }
.diagram .open { fill: none; stroke: var(--text); stroke-width: 1.3; }
.diagram .mute { fill: var(--muted); font-size: 12px; }
.diagram .fret-label { fill: var(--muted); font-size: 10px; }

.strum { display: flex; gap: 4px; margin-bottom: 10px; }
.beat { flex: 1; display: flex; flex-direction: column; align-items: center; background: var(--bg); border-radius: 8px; padding: 6px 0; border: 1px solid var(--border); }
.beat b { font-size: 1.3rem; color: var(--chord); line-height: 1; }
.beat.rest b { color: var(--border); }
.beat small { color: var(--muted); font-size: .75rem; }
.beat.now { background: var(--chord-soft); border-color: var(--chord); }
.hint { font-size: .85rem; color: var(--muted); }
.tips { padding-left: 18px; margin: 0; font-size: .92rem; }
.tips li { margin-bottom: 8px; }
.copyright { text-align: center; }

/* Chords & learn */
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: .9rem; color: var(--muted); }
.legend b { display: inline-block; vertical-align: middle; margin-right: 4px; }
.dot-sample { width: 12px; height: 12px; border-radius: 50%; background: var(--text); }
.open-sample { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--text); }

.learn-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 22px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.learn-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.tuner { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
@media (max-width: 520px) { .tuner { grid-template-columns: repeat(3, 1fr); } }
.string-btn { font: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 4px; cursor: pointer; color: var(--text); display: flex; flex-direction: column; align-items: center; }
.string-btn:hover { border-color: var(--accent); }
.string-btn b { font-size: 1.4rem; color: var(--accent); }
.string-btn small { color: var(--muted); }
.bars.demo { max-width: 400px; font-size: 18px; }

.footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 24px 16px; border-top: 1px solid var(--border); }

@media print {
  .topbar, .toolbar, .footer, .crumbs, .icon-btn, #playStrum, .copyright { display: none !important; }
  body { background: #fff; color: #000; }
  .song-layout { grid-template-columns: 1fr 220px; }
  .sheet, .panel { box-shadow: none; border: none; }
}

/* View tabs + "My lyrics sheet" */
.view-tabs { display: flex; gap: 4px; margin: 4px 0 12px; border-bottom: 1px solid var(--border); }
.tab { font: inherit; background: none; border: none; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--muted); font-weight: 600; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.my-text { width: 100%; min-height: 420px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; line-height: 1.6; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical; }
.edit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.edit-actions.top { justify-content: flex-end; margin: 10px 0 0; }
.btn.danger { color: #dc2626; }
.empty-mine { text-align: center; padding: 24px 8px; }
.cp-heading { font-size: .8em; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 1.4em 0 .4em; }
.cp-line { display: flex; flex-wrap: wrap; align-items: flex-end; margin-bottom: .3em; }
.cp-seg { display: inline-flex; flex-direction: column; }
.cp-chord { min-height: 1.5em; }
.cp-chord .chord { padding: 0 2px; margin-left: -2px; }
.cp-text { white-space: pre; }
.cp-gap { height: .8em; }
@media print { .view-tabs, .edit-actions { display: none !important; } }

/* Artists */
.artist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 8px; }
.artist-card { display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; text-decoration: none; color: inherit; box-shadow: var(--shadow); }
.artist-card:hover { border-color: var(--accent); }
.artist-name { font-weight: 700; font-size: 1.1rem; }
.artist-note { font-size: .85rem; color: var(--muted); }
.badge { font-size: .7rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 999px; vertical-align: middle; }
.song-artist a { color: inherit; }
.view-tabs[hidden] { display: none; }

/* ---------- Fretboard & Tuner ---------- */
:root { --fw: 52px; --open-w: 46px; --tune-w: 128px;
  --c-root: #dc2626; --c-third: #2563eb; --c-fifth: #059669; --c-seventh: #9333ea; --c-other: #d97706;
  --wood: #4a2f1d; --wood-2: #5b3a24; --fretwire: #c8c2b4; --string: #e9e4d6; }
@media (max-width: 640px) { :root { --fw: 42px; --open-w: 40px; --tune-w: 104px; } }

.fb-tuning-bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding-top: 12px; }
.fb-tuning-bar select, .fb-type-row select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); max-width: 100%; }
.fb-tuning-names { display: flex; gap: 8px; flex-wrap: wrap; font-size: 1.3rem; font-weight: 700; margin: 12px 0 4px; }
.fb-tuning-names span { background: var(--accent-soft); color: var(--accent); padding: 2px 12px; border-radius: 8px; }
.fb-changes { margin: 8px 0 0; padding-left: 18px; font-size: .92rem; }
.fb-changes li { margin-bottom: 6px; }
.warn { color: #dc2626; font-weight: 600; }
.fb-modes { margin-top: 20px; }
.fb-roots { margin: 8px 0; }
.fb-roots .chip { min-width: 46px; }
.fb-type-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fb-formula { font-size: 1.05rem; }
.fb-options { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 10px 0; }

.fb-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); padding: 10px 6px 4px; }
.fb { width: 100%; min-width: max-content; user-select: none; -webkit-user-select: none; }
.fb.lefty .fb-row { direction: rtl; }
.fb.lefty .fb-tune, .fb.lefty .fb-cell { direction: ltr; }
.fb-row { display: grid; grid-template-columns: var(--tune-w) 1fr; align-items: stretch; }
.fb-tune { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding-right: 8px; }
.fb-btn { font: inherit; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; line-height: 1; }
.fb-btn:hover { border-color: var(--accent); }
.fb-note { font: inherit; font-weight: 700; min-width: 48px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
.fb-note.changed { border-color: var(--chord); color: var(--chord); }
.fb-note em { font-style: normal; font-size: .75em; margin-left: 3px; color: var(--chord); }

.fb-strings { display: grid; grid-template-columns: var(--open-w) repeat(15, minmax(var(--fw), 1fr)); position: relative; background: linear-gradient(var(--wood), var(--wood-2)); touch-action: pan-y; cursor: ew-resize; }
.fb-row:first-child .fb-strings { border-radius: 8px 8px 0 0; }
.fb-row:nth-last-child(2) .fb-strings { border-radius: 0 0 8px 8px; }
.fb-strings::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: var(--thick); transform: translateY(-50%); background: var(--string); box-shadow: 0 1px 1px rgba(0,0,0,.4); pointer-events: none; }
.fb-row.dragging .fb-strings::before { background: #fde68a; }
.fb-cell { position: relative; height: 38px; border-right: 2px solid var(--fretwire); }
.fb-cell.open { background: var(--surface); border-right: 6px solid #f1ede4; }
.fb-dot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 23px; height: 23px; border-radius: 50%; display: grid; place-items: center; font-size: .66rem; font-weight: 700; letter-spacing: -.02em; color: #fff; z-index: 1; pointer-events: none;
  background-image: radial-gradient(circle at 35% 30%, rgba(255,255,255,.28), rgba(255,255,255,0) 60%);
  box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease, background-color .18s ease; }
.fb-row.dragging .fb-dot { transform: translate(calc(-50% + var(--dx, 0px)), -50%); opacity: .85; }
.fb-dot.natural { background-color: #f8fafc; color: #1f2328; }
.fb-dot.accidental { background-color: rgba(248, 250, 252, .3); color: #fff; font-weight: 500; }
.fb-dot.ghost { background-color: rgba(255,255,255,.16); color: rgba(255,255,255,.75); font-weight: 500; width: 18px; height: 18px; font-size: .58rem; box-shadow: none; }
.fb-dot.role-root { background-color: var(--c-root); }
.fb-dot.role-third { background-color: var(--c-third); }
.fb-dot.role-fifth { background-color: var(--c-fifth); }
.fb-dot.role-seventh { background-color: var(--c-seventh); }
.fb-dot.role-other { background-color: var(--c-other); }
.fb-dot.faded { opacity: .3; transform: translate(-50%, -50%) scale(.82); }
.fb-dot.pick { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px rgba(17,17,17,.85), 0 2px 6px rgba(0,0,0,.45); transform: translate(-50%, -50%) scale(1.08); z-index: 2; }
.fb-mute { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.3rem; font-weight: 700; color: var(--muted); }
.fb-row.markers .fb-strings { background: none; cursor: default; touch-action: auto; }
.fb-row.markers .fb-strings::before { display: none; }
.fb-cell.mark { border-right: 2px solid transparent; height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: .75rem; }
.fb-cell.mark b { font-size: .6rem; letter-spacing: 2px; color: var(--chord); height: 10px; }

.fb-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 10px 2px 18px; font-size: .88rem; color: var(--muted); align-items: center; }
.fb-legend span { display: inline-flex; align-items: center; gap: 6px; }
.fb-legend .fb-dot { position: static; transform: none; width: 16px; height: 16px; display: inline-grid; font-size: .58rem; }
.fb-legend .fb-dot.natural { border: 1px solid var(--border); }
.fb-legend .fb-dot.accidental { background: #94a3b8; }
.fb-legend .fb-dot.pick { transform: none; }

.diagram-card.on { border-color: var(--chord); box-shadow: 0 0 0 2px var(--chord); }
.diagram-card code { font-size: .75rem; }
.fb-compare-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.fb-compare-row .diagram-card { width: 140px; cursor: default; }
.fb-arrow { font-size: 2rem; color: var(--muted); }
.fb-tuning-bar .tool, .fb-type-row .tool { flex-wrap: wrap; min-width: 0; max-width: 100%; }
.fb-tuning-bar select, .fb-type-row select { width: auto; max-width: min(100%, calc(100vw - 48px)); }

/* Mode switch (segmented control) */
.fb-mode-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 20px; }
.fb-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px; background: var(--surface); gap: 2px; margin: 0; }
.fb-seg .tab { border: none; border-radius: 999px; padding: 8px 18px; color: var(--muted); font-weight: 600; }
.fb-seg .tab.on { background: var(--accent); color: #fff; }
.fb-types { margin: 6px 0; }
.fb-types .chip small, .fb-pickers .chip small { color: inherit; opacity: .7; font-weight: 700; margin-right: 2px; }
.fb-sub { margin: 10px 0 4px; }
.note-link { font: inherit; font-weight: 700; background: none; border: none; border-bottom: 2px dotted var(--accent); color: var(--text); cursor: pointer; padding: 0 2px; }

  <script>
/*
 * Chord theory helpers: parsing, transposition, fingering lookup and
 * SVG chord diagrams.
 *
 * Fret arrays go from the LOW E string (6th) to the HIGH E string (1st).
 *   -1 = don't play the string (x), 0 = open string (o), n = press fret n
 * Finger numbers: 1 index, 2 middle, 3 ring, 4 pinky, 0 = none.
 */

const SHARPS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLATS = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

// Open-string pitches in Hz for standard tuning E2 A2 D3 G3 B3 E4.
const OPEN_STRINGS = [
  { name: "E", octave: 2, freq: 82.41 },
  { name: "A", octave: 2, freq: 110.0 },
  { name: "D", octave: 3, freq: 146.83 },
  { name: "G", octave: 3, freq: 196.0 },
  { name: "B", octave: 3, freq: 246.94 },
  { name: "E", octave: 4, freq: 329.63 }
];

// Beginner-friendly open shapes. `barre` = {fret, from, to} string indices.
const CHORD_LIBRARY = {
  // Major
  C:  { frets: [-1, 3, 2, 0, 1, 0], fingers: [0, 3, 2, 0, 1, 0] },
  D:  { frets: [-1, -1, 0, 2, 3, 2], fingers: [0, 0, 0, 1, 3, 2] },
  E:  { frets: [0, 2, 2, 1, 0, 0], fingers: [0, 2, 3, 1, 0, 0] },
  F:  { frets: [-1, -1, 3, 2, 1, 1], fingers: [0, 0, 3, 2, 1, 1], barre: { fret: 1, from: 4, to: 5 }, note: "Easy 'mini F' (4 strings)" },
  G:  { frets: [3, 2, 0, 0, 0, 3], fingers: [2, 1, 0, 0, 0, 3] },
  A:  { frets: [-1, 0, 2, 2, 2, 0], fingers: [0, 0, 1, 2, 3, 0] },
  Bb: { frets: [-1, 1, 3, 3, 3, 1], fingers: [0, 1, 3, 3, 3, 1], barre: { fret: 1, from: 1, to: 5 } },
  // Minor
  Am: { frets: [-1, 0, 2, 2, 1, 0], fingers: [0, 0, 2, 3, 1, 0] },
  Dm: { frets: [-1, -1, 0, 2, 3, 1], fingers: [0, 0, 0, 2, 3, 1] },
  Em: { frets: [0, 2, 2, 0, 0, 0], fingers: [0, 2, 3, 0, 0, 0] },
  Bm: { frets: [-1, -1, 4, 4, 3, 2], fingers: [0, 0, 3, 4, 2, 1], note: "Easy 4-string Bm" },
  // Sevenths
  A7: { frets: [-1, 0, 2, 0, 2, 0], fingers: [0, 0, 2, 0, 3, 0] },
  B7: { frets: [-1, 2, 1, 2, 0, 2], fingers: [0, 2, 1, 3, 0, 4] },
  C7: { frets: [-1, 3, 2, 3, 1, 0], fingers: [0, 3, 2, 4, 1, 0] },
  D7: { frets: [-1, -1, 0, 2, 1, 2], fingers: [0, 0, 0, 2, 1, 3] },
  E7: { frets: [0, 2, 0, 1, 0, 0], fingers: [0, 2, 0, 1, 0, 0] },
  G7: { frets: [3, 2, 0, 0, 0, 1], fingers: [3, 2, 0, 0, 0, 1] },
  // Minor sevenths
  Am7: { frets: [-1, 0, 2, 0, 1, 0], fingers: [0, 0, 2, 0, 1, 0] },
  Dm7: { frets: [-1, -1, 0, 2, 1, 1], fingers: [0, 0, 0, 2, 1, 1], barre: { fret: 1, from: 4, to: 5 } },
  Em7: { frets: [0, 2, 0, 0, 0, 0], fingers: [0, 2, 0, 0, 0, 0] },
  "F#m7": { frets: [-1, -1, 2, 2, 2, 2], fingers: [0, 0, 1, 1, 1, 1], barre: { fret: 2, from: 2, to: 5 }, note: "Easy 4-string F#m7" }
};

// Movable barre templates (relative to the barre fret).
const BARRE_SHAPES = {
  E: {
    rootString: 0, openRoot: 4, // E
    maj: { frets: [0, 2, 2, 1, 0, 0], fingers: [1, 3, 4, 2, 1, 1] },
    min: { frets: [0, 2, 2, 0, 0, 0], fingers: [1, 3, 4, 1, 1, 1] },
    "7": { frets: [0, 2, 0, 1, 0, 0], fingers: [1, 3, 1, 2, 1, 1] },
    m7: { frets: [0, 2, 0, 0, 0, 0], fingers: [1, 3, 1, 1, 1, 1] }
  },
  A: {
    rootString: 1, openRoot: 9, // A
    maj: { frets: [-1, 0, 2, 2, 2, 0], fingers: [0, 1, 3, 3, 3, 1] },
    min: { frets: [-1, 0, 2, 2, 1, 0], fingers: [0, 1, 3, 4, 2, 1] },
    "7": { frets: [-1, 0, 2, 0, 2, 0], fingers: [0, 1, 3, 1, 4, 1] },
    m7: { frets: [-1, 0, 2, 0, 1, 0], fingers: [0, 1, 3, 1, 2, 1] }
  }
};

function noteIndex(note) {
  let i = SHARPS.indexOf(note);
  if (i === -1) i = FLATS.indexOf(note);
  return i;
}

function parseChord(name) {
  const m = /^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/.exec(name.trim());
  if (!m) return null;
  return { root: m[1], suffix: m[2] || "", bass: m[3] || null };
}

// Keys that are conventionally written with flats.
const FLAT_KEYS = ["F", "Bb", "Eb", "Ab", "Db", "Gb", "Dm", "Gm", "Cm", "Fm", "Bbm", "Ebm"];

function transposeNote(note, semitones, useFlats) {
  const i = noteIndex(note);
  if (i === -1) return note;
  const j = ((i + semitones) % 12 + 12) % 12; // modulo that also works for negatives
  return (useFlats ? FLATS : SHARPS)[j];
}

function transposeKey(key, semitones) {
  const p = parseChord(key);
  if (!p) return key;
  // Choose spelling of the resulting key: try sharps, switch to flats if conventional.
  const sharpName = transposeNote(p.root, semitones, false) + p.suffix;
  const flatName = transposeNote(p.root, semitones, true) + p.suffix;
  return FLAT_KEYS.includes(flatName) ? flatName : sharpName;
}

function transposeChord(name, semitones, useFlats) {
  if (semitones === 0) return name;
  const p = parseChord(name);
  if (!p) return name;
  let out = transposeNote(p.root, semitones, useFlats) + p.suffix;
  if (p.bass) out += "/" + transposeNote(p.bass, semitones, useFlats);
  return out;
}

function keyUsesFlats(key) {
  return FLAT_KEYS.includes(key);
}

function quality(suffix) {
  if (suffix === "" || suffix.startsWith("maj") || suffix.startsWith("sus") || suffix === "6" || suffix === "add9") return "maj";
  if (suffix === "7" || suffix === "9") return "7";
  if (suffix === "m7") return "m7";
  if (suffix.startsWith("m") || suffix.startsWith("dim")) return "min";
  return "maj";
}

const SUFFIX_FOR_QUALITY = { maj: "", min: "m", "7": "7", m7: "m7" };

/*
 * Find a fingering for any chord name.
 * 1. Use the open-chord library (also trying the enharmonic spelling, e.g. A# = Bb).
 * 2. Otherwise build a movable barre chord on the E or A string, whichever is lower on the neck.
 */
function getFingering(name) {
  const p = parseChord(name);
  if (!p) return null;
  const base = p.root + p.suffix;
  if (CHORD_LIBRARY[base]) return { name: base, ...CHORD_LIBRARY[base] };

  const idx = noteIndex(p.root);
  const q = quality(p.suffix);
  const simple = SHARPS[idx] + SUFFIX_FOR_QUALITY[q];
  const simpleFlat = FLATS[idx] + SUFFIX_FOR_QUALITY[q];
  for (const n of [simple, simpleFlat]) {
    if (CHORD_LIBRARY[n]) return { name: n, ...CHORD_LIBRARY[n], simplified: SUFFIX_FOR_QUALITY[q] !== p.suffix };
  }

  let best = null;
  for (const shapeName of ["E", "A"]) {
    const shape = BARRE_SHAPES[shapeName];
    let fret = ((idx - shape.openRoot) % 12 + 12) % 12;
    if (fret === 0) fret = 12;
    if (!best || fret < best.fret) best = { shapeName, shape, fret };
  }
  const t = best.shape[q];
  const frets = t.frets.map(f => (f < 0 ? -1 : f + best.fret));
  const from = best.shape.rootString;
  return {
    name: simple,
    frets,
    fingers: t.fingers,
    barre: { fret: best.fret, from, to: 5 },
    note: `Barre chord (${best.shapeName}-shape, fret ${best.fret})`,
    simplified: SUFFIX_FOR_QUALITY[q] !== p.suffix
  };
}

/* ---------- SVG chord diagram ---------- */

function chordDiagramSVG(name, opts = {}) {
  const f = getFingering(name);
  if (!f) return "";
  return fingeringSVG(f, name, opts);
}

/*
 * Suggest fingers for any fret pattern.
 * Notes on the SAME fret ("column") over neighbouring strings can be pressed
 * by ONE flat finger (a barre / pestana) — as long as no string under that
 * finger needs a lower fret or must ring open.
 *  1. The index finger barres the lowest fret when it can (the classic barre).
 *  2. If that still needs more than 4 fingers, other columns are barred too
 *     (e.g. the ring finger across 3 strings in an A-shape barre chord).
 *  3. Fingers are then numbered from the lowest fret upwards: 1 index … 4 pinky.
 */
function autoFingering(frets) {
  const fingers = frets.map(() => 0);
  const groups = new Map(); // fret → strings pressed at that fret
  frets.forEach((f, s) => { if (f > 0) { if (!groups.has(f)) groups.set(f, []); groups.get(f).push(s); } });
  const order = [...groups.keys()].sort((a, b) => a - b);
  const canBarre = F => {
    const ss = groups.get(F);
    if (ss.length < 2) return false;
    for (let s = ss[0]; s <= ss[ss.length - 1]; s++) if (frets[s] < F) return false;
    return true;
  };
  const barred = new Set();
  if (order.length && canBarre(order[0])) barred.add(order[0]);
  const count = () => order.reduce((n, F) => n + (barred.has(F) ? 1 : groups.get(F).length), 0);
  const extra = order.filter(F => !barred.has(F) && canBarre(F))
    .sort((a, b) => groups.get(b).length - groups.get(a).length || a - b);
  for (const F of extra) { if (count() <= 4) break; barred.add(F); }

  let next = 1;
  const barres = [];
  for (const F of order) {
    const ss = groups.get(F);
    if (barred.has(F)) {
      ss.forEach(s => { fingers[s] = next; });
      barres.push({ fret: F, from: ss[0], to: ss[ss.length - 1], finger: next });
      next++;
    } else ss.forEach(s => { fingers[s] = next++; });
  }
  // Fewest fingers possible if every barrable column is pressed by one finger.
  const minCount = order.reduce((n, F) => n + (canBarre(F) ? 1 : groups.get(F).length), 0);
  return { frets, fingers, barres, barre: barres[0] || null, count: next - 1, minCount };
}

function fingeringSVG(f, name, opts = {}) {
  const lefty = !!opts.lefty;
  const frets = lefty ? [...f.frets].reverse() : f.frets;
  const fingers = lefty ? [...f.fingers].reverse() : f.fingers;
  let barres = f.barres || (f.barre ? [f.barre] : []);
  if (lefty) barres = barres.map(b => ({ fret: b.fret, from: 5 - b.to, to: 5 - b.from }));

  const played = frets.filter(x => x > 0);
  const maxFret = played.length ? Math.max(...played) : 0;
  const minFret = played.length ? Math.min(...played) : 0;
  const startFret = maxFret > 4 ? minFret : 1; // window of 4 frets
  const nFrets = 4;

  const W = 110, H = 130;
  const left = 18, top = 30, gridW = 76, gridH = 84;
  const sx = gridW / 5, fy = gridH / nFrets;

  // open / muted markers
  frets.forEach((fr, s) => {
    if (fr === 0) svg += `<circle cx="${x(s)}" cy="${top - 12}" r="4" class="open"/>`;
    if (fr === -1) svg += `<text x="${x(s)}" y="${top - 8}" class="mute" text-anchor="middle">×</text>`;
  });

  for (const barre of barres) {
    svg += `<rect x="${x(barre.from) - 6}" y="${y(barre.fret) - 6}" width="${x(barre.to) - x(barre.from) + 12}" height="12" rx="6" class="dot"/>`;
  }
  frets.forEach((fr, s) => {
    if (fr > 0) {
      const barre = barres.find(b => fr === b.fret && s >= b.from && s <= b.to);
      const onBarre = !!barre;
      if (!onBarre) svg += `<circle cx="${x(s)}" cy="${y(fr)}" r="6.5" class="dot"/>`;
      if (fingers[s] && (!onBarre || s === barre.from)) {
        svg += `<text x="${x(s)}" y="${y(fr) + 3.5}" class="finger" text-anchor="middle">${fingers[s]}</text>`;
      }
    }
  });
  svg += `</svg>`;
  return svg;

  <script>
/*
 * Tiny guitar synthesiser using the Karplus–Strong algorithm.
 *
 * A plucked string is modelled as a short delay line filled with noise.
 * Each pass, neighbouring samples are averaged (a low-pass filter) and
 * slightly damped, so high frequencies die first — just like a real string.
 * The length of the delay line sets the pitch: N = sampleRate / frequency.
 *
 * Pitch of a fretted note: f = f_open × 2^(fret / 12)
 * (each fret raises the pitch by one semitone, and 12 semitones = double frequency).
 */
const GuitarAudio = (() => {
  let ctx = null;
  const cache = new Map();

  function context() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function pluckBuffer(freq) {
    const key = freq.toFixed(2);
    if (cache.has(key)) return cache.get(key);
    const c = context();
    const sr = c.sampleRate;
    const dur = 2.5;
    const buffer = c.createBuffer(1, Math.floor(sr * dur), sr);
    const data = buffer.getChannelData(0);
    const N = Math.max(2, Math.round(sr / freq));
    const ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    const decay = 0.996;
    for (let i = 0; i < data.length; i++) {
      const a = i % N, b = (i + 1) % N;
      data[i] = ring[a];
      ring[a] = decay * 0.5 * (ring[a] + ring[b]);
    }
    cache.set(key, buffer);
    return buffer;
  }

  function playFreq(freq, when = 0, gainValue = 0.35) {
    const c = context();
    const src = c.createBufferSource();
    src.buffer = pluckBuffer(freq);
    const g = c.createGain();
    g.gain.value = gainValue;
    src.connect(g).connect(c.destination);
    src.start(c.currentTime + when);
  }

  function fretFreq(stringIdx, fret, capo = 0) {
    return OPEN_STRINGS[stringIdx].freq * Math.pow(2, (fret + capo) / 12);
  }

  // Strum a chord: down = low→high, up = high→low.
  function strum(frets, { capo = 0, direction = "D", when = 0, spread = 0.03, gain = 0.3 } = {}) {
    const order = [0, 1, 2, 3, 4, 5];
    if (direction === "U") order.reverse();
    let k = 0;
    for (const s of order) {
      if (frets[s] < 0) continue;
      playFreq(fretFreq(s, frets[s], capo), when + k * spread, gain);
      k++;
    }
  }

  function playString(stringIdx) {
    playFreq(OPEN_STRINGS[stringIdx].freq, 0, 0.5);
  }

  // Play a strum pattern (8 eighth-note slots) once over a chord.
  function playPattern(frets, pattern, bpm, capo = 0) {
    const eighth = 60 / bpm / 2;
    [...pattern].forEach((slot, i) => {
      if (slot === "D" || slot === "U") {
        strum(frets, { capo, direction: slot, when: i * eighth, gain: slot === "U" ? 0.18 : 0.3, spread: 0.018 });
      }
    });
    return pattern.length * eighth;
  }

  // MIDI note number → frequency. A4 = MIDI 69 = 440 Hz; each semitone ×2^(1/12).
  const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);

  function playMidi(m, when = 0, gain = 0.4) {
    playFreq(midiFreq(m), when, gain);
  }

  // Strum a list of MIDI notes (low → high); null entries are skipped.
  function strumMidis(midis, { direction = "D", spread = 0.035, gain = 0.3 } = {}) {
    const list = midis.filter(m => m !== null && m !== undefined);
    if (direction === "U") list.reverse();
    list.forEach((m, k) => playFreq(midiFreq(m), k * spread, gain));
  }

  function playSequence(midis, gap = 0.28) {
    midis.forEach((m, k) => playFreq(midiFreq(m), k * gap, 0.4));
  }

  return { strum, playString, playPattern, playMidi, strumMidis, playSequence, midiFreq };
})();

/*

  { id: "drop-d", name: "Drop D (D A D G B E)", notes: [38, 45, 50, 55, 59, 64] },
  { id: "half-down", name: "Half step down (E♭ A♭ D♭ G♭ B♭ E♭)", notes: [39, 44, 49, 54, 58, 63] },

  { id: "open-c", name: "Open C (C G C G C E)", notes: [36, 43, 48, 55, 60, 64] }

const CHORD_TYPES = [
  { id: "", name: "Major", iv: [0, 4, 7] },
  { id: "m", name: "Minor", iv: [0, 3, 7] },
  { id: "7", name: "Dominant 7", iv: [0, 4, 7, 10] },
  { id: "maj7", name: "Major 7", iv: [0, 4, 7, 11] },
  { id: "m7", name: "Minor 7", iv: [0, 3, 7, 10] },
  { id: "sus2", name: "Sus2", iv: [0, 2, 7] },
  { id: "sus4", name: "Sus4", iv: [0, 5, 7] },
  { id: "6", name: "Major 6", iv: [0, 4, 7, 9] },
  { id: "m6", name: "Minor 6", iv: [0, 3, 7, 9] },
  { id: "add9", name: "Add9", iv: [0, 4, 7, 2] },
  { id: "dim", name: "Diminished", iv: [0, 3, 6] },
  { id: "aug", name: "Augmented", iv: [0, 4, 8] },
  { id: "5", name: "Power chord (5)", iv: [0, 7] }
];

const SCALE_TYPES = [
  { id: "major", name: "Major (Ionian)", iv: [0, 2, 4, 5, 7, 9, 11] },
  { id: "minor", name: "Natural minor (Aeolian)", iv: [0, 2, 3, 5, 7, 8, 10] },
  { id: "maj-pent", name: "Major pentatonic", iv: [0, 2, 4, 7, 9] },
  { id: "min-pent", name: "Minor pentatonic", iv: [0, 3, 5, 7, 10] },
  { id: "blues", name: "Blues", iv: [0, 3, 5, 6, 7, 10] },
  { id: "harm-minor", name: "Harmonic minor", iv: [0, 2, 3, 5, 7, 8, 11] },
  { id: "dorian", name: "Dorian", iv: [0, 2, 3, 5, 7, 9, 10] },
  { id: "mixolydian", name: "Mixolydian", iv: [0, 2, 4, 5, 7, 9, 10] }
];

const ROOT_NAMES = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const CHORD_INTERVALS = ["R", "♭2", "9", "♭3", "3", "4", "♭5", "5", "♯5", "6", "♭7", "7"];
const SCALE_INTERVALS = ["R", "♭2", "2", "♭3", "3", "4", "♭5", "5", "♭6", "6", "♭7", "7"];

const pretty = n => n.replace("#", "♯").replace(/([A-G])b/, "$1♭");

function intervalRole(i) {
  if (i === 0) return "root";
  if (i === 3 || i === 4) return "third";
  if (i === 6 || i === 7 || i === 8) return "fifth";
  if (i === 10 || i === 11) return "seventh";

// Choose sharps or flats: for 7-note scales use the spelling that gives each
// letter exactly once (e.g. F major has B♭, not A♯); otherwise follow the root.

/*
 * Correct spelling from intervals: a 3rd always uses the letter two steps above
 * the root, a 5th four steps, a 7th six steps… So C minor's 3rd is E♭ (letter E),
 * never D♯. Returns a Map pitch-class → name for the notes of a chord/scale.
 */
function spellSet(rootPc, iv, isChord) {
  const LETTERS = "CDEFGAB";
  const NATURAL = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const letterSteps = { 0: 0, 1: 1, 2: 1, 3: 2, 4: 2, 5: 3, 6: 4, 7: 4, 8: isChord ? 4 : 5, 9: 5, 10: 6, 11: 6 };
  // Name of pitch class p using letter L (adds ♯/♭ as needed; E♯, B♯, C♭, F♭ allowed).
  const nameWith = (p, L) => {
    const d = ((p - NATURAL[L] + 18) % 12) - 6;     // -6..5 semitones away from the natural
    return d === 0 ? L : d === 1 ? L + "#" : d === -1 ? L + "b" : d === 2 ? L + "##" : d === -2 ? L + "bb" : null;
  };

  // use each letter once with the fewest sharps/flats — C♯ major becomes D♭ major.
  const roots = [...new Set([SHARPS[rootPc], FLATS[rootPc], ROOT_NAMES[rootPc]])];
  let best = null;
  for (const rn of roots) {
    const r = LETTERS.indexOf(rn[0]);
    const map = new Map();
    let cost = 0, bad = false;
    for (const i of iv) {
      const p = pc(rootPc + i);
      const n = nameWith(p, LETTERS[(r + letterSteps[pc(i)]) % 7]);
      if (!n || n.length > 2) { bad = true; break; }
      if (n.length === 2) cost += 1;
      if (["E#", "B#", "Cb", "Fb"].includes(n)) cost += 0.5;
      map.set(p, n);
    }
    if (bad) continue;
    if (rn !== ROOT_NAMES[rootPc]) cost += 0.25;         // tie-break: keep the usual root name
    if (!best || cost < best.cost) best = { cost, map };
  }
  const out = new Map();
  if (best) { for (const [p, n] of best.map) out.set(p, pretty(n)); return out; }
  for (const i of iv) { const p = pc(rootPc + i); out.set(p, pretty(SHARPS[p])); }
  return out;
}

const noteName = (p, flats) => pretty((flats ? FLATS : SHARPS)[pc(p)]);
const midiName = (m, flats) => `${noteName(m, flats)}<sub>${Math.floor(m / 12) - 1}</sub>`;

/*

 * We slide a 4-fret window up the neck; on each string we may mute it, play it
 * open, or press a fret inside the window — but only on notes of the chord.
 * A shape is kept if: it has every needed chord note, there are no muted
 * strings in the middle, and it needs ≤ 4 fingers
 * (a barre counts as one finger).

function findVoicings(tuning, rootPc, iv, { maxFret = 15, limit = 12 } = {}) {

  // but ranked lower — except in open tunings, where they are often the best shapes.
  const chordPcs = iv.map(i => pc(rootPc + i));

      for (let f = w; f <= w + 3; f++) if (chordPcs.includes(pc(open + f))) c.push(f);
      return c;

    (function rec(s) {
      if (s === 6) {
        const v = evaluateVoicing(cur, tuning, rootPc, required, minStrings);
        if (v && !seen.has(v.key)) seen.set(v.key, v);
        return;
      }
      for (const f of cands[s]) { cur[s] = f; rec(s + 1); }
    })(0);
  }

  let list = [...seen.values()];
  // Drop shapes that are just another shape with strings removed.
  // (only if the bigger shape is no harder to play).

function evaluateVoicing(frets, tuning, rootPc, required, minStrings) {
  const played = frets.map((f, s) => (f >= 0 ? s : -1)).filter(s => s >= 0);
  if (played.length < minStrings) return null;
  const first = played[0], last = played[played.length - 1];
  for (let s = first; s <= last; s++) if (frets[s] < 0) return null;       // no muted string in the middle
  const bassPc = pc(tuning[first] + frets[first]);
  const inversion = bassPc !== rootPc;                                      // another chord note in the bass
  const present = new Set(played.map(s => pc(tuning[s] + frets[s])));
  if (!required.every(p => present.has(p))) return null;

  const fretted = played.map(s => frets[s]).filter(f => f > 0);
  const opens = played.length - fretted.length;
  let fingers = 0, minFingers = 0, barre = false, barreCount = 0, minF = 0, maxF = 0, columns = 0;
  if (fretted.length) {
    minF = Math.min(...fretted); maxF = Math.max(...fretted);
    if (maxF - minF > 3) return null;
    // One finger can press several notes on the same fret (barre) — see autoFingering.
    const plan = autoFingering(frets);
    fingers = plan.count;
    if (fingers > 4) return null;
    barreCount = plan.barres.length;
    barre = plan.barres.some(b => b.fret === minF);
    columns = new Set(fretted).size; // how many different frets ("columns") the hand covers
    minFingers = plan.minCount;     // fewest fingers if one finger takes each barrable column
  }

  // shapes where one finger covers several notes rank higher.
  const score = minF * 1.4 + (maxF - minF) + minFingers * 1.0 + columns * 0.7
    - played.length * 1.5 - opens * 0.7 + (inversion ? 4 : 0)
    + (5 - last) * 1.5; // muting thin strings while strumming is hard

// Which chord do the open strings make? (Open tunings are designed for this.)

  const set = [...new Set(pcsList.map(pc))].sort((a, b) => a - b);
  for (const t of CHORD_TYPES) {
    for (let r = 0; r < 12; r++) {
      const c = [...new Set(t.iv.map(i => pc(r + i)))].sort((a, b) => a - b);
      if (c.length === set.length && c.every((p, k) => p === set[k])) return { root: r, type: t };

  return null;

  function scaleFinger(f) {
    const pos = scalePos();
    if (pos === 0) return f <= 4 ? f : null;
    return f >= pos && f <= pos + 3 ? f - pos + 1 : null;
  }
  /*
   * Scale views (all built by js/scales.js, shared with the School and Jam room):
   *  neck    – Across the neck: every pitch once, a diagonal "travel route"
   *  pattern – One position: the root's shape on its own
   *  shapes  – Shapes: pick any of the hand positions; the rest of the scale is faded
   *  octave  – one octave from the root
   */
  function scalePattern(a) {
    if (st.mode !== "scale" || st.scaleView === "all") return null;
    const iv = [...a.iv].sort((x, y) => x - y);
    if (st.scaleView === "neck") return finishPattern(acrossNeck(a.root, iv, st.tuning, FRETS));
    if (st.scaleView === "octave") return finishPattern(oneOctave(a.root, iv, st.tuning, FRETS));
    const shapes = scaleShapes(a.root, iv, st.tuning, FRETS);
    if (!shapes.length) return null;
    const idx = st.scaleView === "pattern" ? 0 : Math.min(st.scaleShape || 0, shapes.length - 1);
    const sel = shapes[idx];
    if (st.scaleView === "pattern") return finishPattern(sel.cells, { band: [sel.lo, sel.hi], shape: sel, shapes });
    const inShape = (s, f) => sel.cells.some(c => c.s === s && c.f === f);
    return finishPattern(sel.cells, { has: () => true, inShape, band: [sel.lo, sel.hi], shape: sel, shapes });
  }

  function finishPattern(cells, extra = {}) {
    const fingerOf = new Map(cells.map(c => [c.s + ":" + c.f, c.finger]));
    return {
      cells, ...extra,
      has: extra.has || ((s, f) => cells.some(c => c.s === s && c.f === f)),
      finger: (f, s) => (f === 0 ? 0 : fingerOf.get(s + ":" + f) || 1)
    };
  }

  const fingerText = v => v.fingers === 0 ? "No fingers — all open"
    : `${v.fingers} finger${v.fingers === 1 ? "" : "s"}` +
      (v.barreCount ? ` · ${v.barreCount === 1 ? "1 finger presses several notes" : v.barreCount + " fingers press several notes"}` : "");

  // The shape shown on the neck: the user's own, or the selected suggestion.
  function currentShape() {
    if (st.custom && st.mode !== "notes") return { frets: st.custom, custom: true };
    return st.mode === "chord" ? voicings[st.voicing] : null;
  }

  let voicings = [];

  /* ----- Tuning panel ----- */
  function drawTuningInfo() {
    const preset = TUNING_PRESETS.find(p => p.notes.every((n, k) => n === st.tuning[k]));
    $("#preset").value = preset ? preset.id : "custom";
    const isStd = st.tuning.every((m, k) => m === STANDARD_TUNING[k]);
    $("#stageTuning").innerHTML = `Tuning: <strong>${st.tuning.map(m => noteName(m, false)).join(" ")}</strong>${isStd ? " (standard)" : ""}`;
    for (const id of ["#stdBtn", "#resetTuning"]) {
      $(id).disabled = isStd;
      $(id).title = isStd ? "Already in standard tuning" : "Retune all strings to E A D G B E";
    }
    const flats = false;
    const changes = st.tuning.map((m, s) => ({ s, m, d: m - STANDARD_TUNING[s] })).filter(x => x.d !== 0);
    const openChord = detectChord(st.tuning);
    const ordinal = s => ["6th", "5th", "4th", "3rd", "2nd", "1st"][s];

    $("#tuningInfo").innerHTML = `
      <p class="fb-tuning-names">${st.tuning.map(m => `<span>${midiName(m, flats)}</span>`).join("")}</p>
      ${openChord ? `<p class="callout">🎸 Strummed open, your strings form a <strong>${noteName(openChord.root, chooseFlats(openChord.root, openChord.type.iv))}${openChord.type.id}</strong> chord (${openChord.type.name}). That's an <em>open tuning</em>: one finger across all strings (a barre) gives you a new chord at every fret.</p>` : ""}
      ${changes.length ? `<ul class="fb-changes">${changes.slice().reverse().map(c => {
        const dir = c.d < 0 ? "down" : "up";
        const n = Math.abs(c.d);
        const warn = c.d > 2 ? ` <span class="warn">⚠ ${c.d} semitones above standard — high string tension, it may break.</span>`
          : c.d < -5 ? ` <span class="warn">⚠ very slack — the string may buzz.</span>` : "";
        return `<li><strong>${ordinal(c.s)} string</strong>: ${midiText(STANDARD_TUNING[c.s])} → ${midiText(c.m)} (tuned ${dir} ${n} semitone${n > 1 ? "s" : ""}).
          Every note on this string is now ${n} fret${n > 1 ? "s" : ""} ${c.d < 0 ? "<em>higher up</em>" : "<em>lower down</em>"} the neck than in standard tuning.${warn}</li>`;
      }).join("")}</ul>` : `<p class="hint">Standard tuning. Drag a string left or right (or use − / +) to retune it.</p>`}
    `;
  }

  /* ----- Mode pickers ----- */
  function drawPickers() {
    document.querySelectorAll(".fb-modes .tab").forEach(t => t.classList.toggle("on", t.dataset.mode === st.mode));
    const p = $("#pickers");
    if (st.mode === "notes") {
      p.innerHTML = `<p class="hint">Every note on the neck. Natural notes (no ♯/♭) are highlighted — learning where they are is the first step to knowing the fretboard.</p>`;
      return;
    }
    const isChord = st.mode === "chord";
    const root = isChord ? st.chordRoot : st.scaleRoot;
    const types = isChord ? CHORD_TYPES : SCALE_TYPES;
    const typeId = isChord ? st.chordType : st.scaleType;
    const a = activeSet();
    const names = a.pcs.map(x => `<button class="note-link ${st.focus && st.focus.pc === x ? "on" : ""}" data-focus-pc="${x}">${a.nm(x)}</button>`);
    const ivNames = a.iv.map(i => a.names[i]);
    let formula = "";
    if (isChord) {
      formula = `<strong>${a.nm(root)}${chordType().id}</strong> = ${names.join(" · ")} <span class="hint">(${ivNames.join(" · ")})</span>`;
    } else {
      const sorted = [...a.iv].sort((x, y) => x - y);
      const steps = sorted.map((v, k) => (k + 1 < sorted.length ? sorted[k + 1] : 12) - v)
        .map(d => ({ 1: "H", 2: "W", 3: "W+H", 4: "2W" }[d] || d));
      formula = `<strong>${a.nm(root)} ${scaleType().name}</strong> = ${names.join(" · ")}
        <span class="hint">(steps: ${steps.join(" ")} — W = whole tone = 2 frets, H = half tone = 1 fret)</span>`;
    }
    p.innerHTML = `
      <div class="chips fb-roots" role="group" aria-label="Root note">
        ${ROOT_NAMES.map((n, i) => `<button class="chip ${i === root ? "on" : ""}" data-root="${i}">${pretty(n)}</button>`).join("")}
      </div>
      <div class="chips fb-types" role="group" aria-label="${isChord ? "Chord type" : "Scale type"}">
        ${types.map(t => `<button class="chip ${t.id === typeId ? "on" : ""}" data-type="${t.id}">${isChord ? (a.nm(root) + t.id) : t.name}</button>`).join("")}
      </div>
      <p class="fb-formula">${formula}
        ${isChord ? `<button class="btn small" id="playChord">▶ Play</button>` : `<button class="btn small" id="playScale">▶ Play scale</button>`}</p>
      ${isChord ? "" : `<div class="fb-pos"><span class="tool-label">View</span>
        ${[["neck", "Across the neck"], ["pattern", "One position"], ["shapes", "Shapes"], ["octave", "One octave"], ["all", "Every note"]]
          .map(([id, l]) => `<button class="chip ${st.scaleView === id ? "on" : ""}" data-view="${id}">${l}</button>`).join("")}</div>`}
      ${!isChord && st.scaleView === "neck" ? `<p class="hint">A travel route: each pitch once, from the open 6th string to fret ${FRETS} of the 1st string. Your hand slides along the strings as it climbs — to play without moving the hand, use <strong>Shapes</strong>.</p>` : ""}
      ${!isChord && st.scaleView === "pattern" ? `<p class="hint">The root's shape: the hand position that starts on the root on the 6th string. Every note within reach, one finger per fret.</p>` : ""}
      ${!isChord && st.scaleView === "shapes" ? shapesHTML(a) : ""}
      ${!isChord && st.labels === "fingers" && st.scaleView === "all" ? positionsHTML() : ""}
      ${isChord ? "" : scaleChordsHTML(a)}
    `;
    p.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
      st.scaleView = b.dataset.view; st.custom = null; st.activeString = null; save(); drawPickers(); drawFretboard(); drawShapeInfo();
    });
    p.querySelectorAll("[data-shape]").forEach(b => b.onclick = () => {
      const n = scalePattern(activeSet()).shapes.length, v = b.dataset.shape;
      st.scaleShape = v === "prev" ? (st.scaleShape + n - 1) % n : v === "next" ? (st.scaleShape + 1) % n : Number(v);
      st.custom = null; st.activeString = null; save(); drawPickers(); drawFretboard(); drawShapeInfo();
    });
    p.querySelectorAll("[data-pos]").forEach(b => b.onclick = () => {
      const v = b.dataset.pos;
      const cur = scalePos();
      st.scalePos = v === "prev" ? Math.max(0, cur - 1) : v === "next" ? Math.min(12, cur + 1) : Number(v);
      st.custom = null; st.activeString = null;
      save(); drawPickers(); drawFretboard(); drawShapeInfo();
    });
    p.querySelectorAll("[data-root]").forEach(b => b.onclick = () => {
      if (isChord) st.chordRoot = Number(b.dataset.root); else { st.scaleRoot = Number(b.dataset.root); st.scalePos = null; st.scaleShape = 0; }
      st.voicing = 0; st.custom = null; st.activeString = null; save(); drawAll();
      if (isChord && voicings[0]) playVoicing(voicings[0]);
    });
    p.querySelectorAll("[data-type]").forEach(b => b.onclick = () => {
      if (isChord) st.chordType = b.dataset.type; else { st.scaleType = b.dataset.type; st.scaleShape = 0; }
      st.voicing = 0; st.custom = null; st.activeString = null; save(); drawAll();
      if (isChord && voicings[0]) playVoicing(voicings[0]);
    });
    p.querySelectorAll("[data-focus-pc]").forEach(b => b.onclick = () => {
      const x = Number(b.dataset.focusPc);
      st.focus = st.focus && st.focus.pc === x && st.focus.midi === null ? null : { pc: x, midi: null };
      drawPickers(); drawFretboard(); drawFocus();
    });
    // Chords of the scale → jump to chord mode.
    p.querySelectorAll("[data-goto-chord]").forEach(b => b.onclick = () => {
      const [r, t] = b.dataset.gotoChord.split("|");
      st.mode = "chord"; st.chordRoot = Number(r); st.chordType = t; st.voicing = 0; st.custom = null; st.activeString = null; save(); drawAll();
      if (voicings[0]) playVoicing(voicings[0]);
    });
    if ($("#playChord")) $("#playChord").onclick = () => { if (voicings[st.voicing]) playVoicing(voicings[st.voicing]); };
    if ($("#playScale")) $("#playScale").onclick = () => {
      const pat = scalePattern(a);
      if (pat) { GuitarAudio.playSequence(pat.cells.map(c => c.m), 0.24); return; }
      // Whole neck: start from the lowest root on the 6th string, go up one octave.
      let start = st.tuning[0];
      while (pc(start) !== st.scaleRoot) start++;
      const seq = [...a.iv].sort((x, y) => x - y).map(i => start + i).concat(start + 12);
      GuitarAudio.playSequence(seq);
    };
  }

  /* ----- The neck ----- */
  function drawFretboard() {
    const a = activeSet();
    const flats = a ? a.flats : false;
    const v = currentShape();
    const fing = v ? autoFingering(v.frets) : null;
    const pat = a ? scalePattern(a) : null;
    const fb = $("#fb");
    fb.classList.toggle("lefty", prefs.lefty);
    const rows = [];
    for (let s = 5; s >= 0; s--) {
      const open = st.tuning[s];
      const d = open - STANDARD_TUNING[s];
      const cells = [];
      for (let f = 0; f <= FRETS; f++) {
        const m = open + f, p = pc(m);
        let dot = "";
        let cls = "";
        let label = nameIn(a, p);
        const fingersMode = st.labels === "fingers" && a;
        const inSet = a && a.pcs.includes(p) && (!pat || v || pat.has(s, f));
        if (!a) {
          cls = (flats ? FLATS : SHARPS)[p].length === 1 ? "natural" : "accidental";
        } else if (inSet) {
          const i = pc(p - a.root);
          cls = "role-" + intervalRole(i);
          if (st.labels === "intervals") label = a.names[i];
          if (v) cls += v.frets[s] === f ? " pick" : " faded";
          if (!v && pat && pat.inShape && !pat.inShape(s, f)) cls += " faded";
          // Options: the other chord/scale notes on the string the user tapped.
          if (st.activeString === s && !(v && v.frets[s] === f)) cls += " option";
          if (fingersMode && v && v.frets[s] === f) {
            // Finger from the same logic as the chord diagrams (1 index … 4 pinky, 0 open).
            const fg = fing;
            label = f === 0 ? "0" : String(fg.fingers[s]);
            cls += " finger" + (f === 0 ? " open-string" : "");
            if (fg.barres.some(b => f === b.fret && s >= b.from && s <= b.to)) cls += " barre-note";
          } else if (fingersMode && pat && !v && (!pat.inShape || pat.inShape(s, f))) {
            label = String(pat.finger(f, s));
            cls += " finger" + (f === 0 ? " open-string" : "");
          } else if (fingersMode && st.mode === "scale" && !v) {
            const fg = scaleFinger(f);
            if (fg !== null) { label = String(fg); cls += " finger pick" + (f === 0 ? " open-string" : ""); }
            else cls += " faded";
          }
        } else if (st.showAll) {
          cls = "ghost";
        } else {
          label = null;
        }
        if (st.focus && st.focus.pc === p) {
          if (label === null) { label = nameIn(a, p); cls = "ghost"; }
          cls += st.focus.midi === m ? " focus focus-exact" : " focus";
        }
        if (label !== null) dot = `<span class="fb-dot ${cls}">${label}</span>`;
        if (f === 0 && v && v.frets[s] === -1 && !(st.activeString === s && a && a.pcs.includes(p))) dot = `<span class="fb-mute">×</span>`;
        const inBand = pat && pat.band && !v && f >= pat.band[0] && f <= pat.band[1] && f > 0;
        cells.push(`<div class="fb-cell ${f === 0 ? "open" : ""} ${inBand ? "in-band" : ""}" data-f="${f}">${dot}</div>`);
      }
      rows.push(`
        <div class="fb-row ${st.activeString === s ? "active-string" : ""}" data-s="${s}" style="--thick:${(1 + (5 - s) * 0.45).toFixed(2)}px">
          <div class="fb-tune">
            <button class="fb-btn" data-tune="1" data-s="${s}" aria-label="Tune string up">+</button>
            <button class="fb-note ${d ? "changed" : ""}" data-open="${s}" title="Play open string">${midiName(open, false)}</button>
            <button class="fb-btn" data-tune="-1" data-s="${s}" aria-label="Tune string down">−</button>
          </div>
          <div class="fb-strings">${cells.join("")}</div>
        </div>`);
    }
    const marks = [];
    for (let f = 0; f <= FRETS; f++) {
      const dots = [3, 5, 7, 9, 15].includes(f) ? "●" : f === 12 ? "●●" : "";
      marks.push(`<div class="fb-cell mark"><span>${f}</span><b>${dots}</b></div>`);
    }
    rows.push(`<div class="fb-row markers"><div class="fb-tune"></div><div class="fb-strings">${marks.join("")}</div></div>`);
    fb.innerHTML = rows.join("");
  }

  function drawLegend() {
    const a = activeSet();
    if (!a) {
      $("#legend").innerHTML = `<span><i class="fb-dot natural">C</i> natural note</span><span><i class="fb-dot accidental">C♯</i> sharp / flat</span>`;
      return;
    }
    const roles = [...new Set(a.iv.map(intervalRole))];
    const label = { root: "root (R)", third: "3rd — major/minor colour", fifth: "5th", seventh: "7th", other: "other notes" };
    $("#legend").innerHTML = ["root", "third", "fifth", "seventh", "other"].filter(r => roles.includes(r))
      .map(r => `<span><i class="fb-dot role-${r}"></i> ${label[r]}</span>`).join("") +
      (st.mode === "chord" ? `<span><i class="fb-dot role-root pick"></i> selected shape</span>` : "") +
      (st.labels === "fingers" ? `<span class="fb-finger-legend"><i class="fb-dot role-other finger">1</i> index · 2 middle · 3 ring · 4 pinky
        <i class="fb-dot finger open-string">0</i> open string · same number on several strings = barre (pestana)</span>` : "");
  }

  /* ----- Chord shapes ----- */
  function playVoicing(v) {
    GuitarAudio.strumMidis(v.frets.map((f, s) => (f < 0 ? null : st.tuning[s] + f)));
  }

  function shapeLabel(v) {
    if (v.minF === 0 || v.frets.some(f => f === 0)) return v.minF <= 3 ? "Open position" : `Fret ${v.minF} + open strings`;
    return v.barre ? `Barre, fret ${v.minF}` : `Fret ${v.minF}`;
  }

  function drawVoicings() {
    const box = $("#voicings");
    if (st.mode !== "chord") { box.innerHTML = ""; return; }
    const a = activeSet();
    const name = a.nm(st.chordRoot) + chordType().id;
    const isStandard = st.tuning.every((m, s) => m === STANDARD_TUNING[s]);
    const card = (v, i, small) => `
      <button class="diagram-card ${i === st.voicing && !small && !st.custom ? "on" : ""}" ${small ? "" : `data-v="${i}"`}
        title="${v.inversion ? "Inversion: the lowest note is " + a.nm(v.bassPc) + ", not the root" : ""}">
        <span class="diagram-name">${name}${v.inversion ? "/" + a.nm(v.bassPc) : ""}</span>
        ${fingeringSVG(autoFingering(v.frets), name, { lefty: prefs.lefty })}
        <small>${shapeLabel(v)}<span class="finger-count">${fingerText(v)}</span><code>${fretsText(v.frets)}</code></small>
      </button>`;

    let compare = "";
    if (!isStandard && voicings.length) {
      const std = findVoicings(STANDARD_TUNING, st.chordRoot, chordType().iv, { limit: 1 })[0];
      if (std) {
        const same = std.key === voicings[0].key;
        compare = `
          <div class="panel fb-compare">
            <h2>What your tuning changes</h2>
            <div class="fb-compare-row">
              <div><p class="tool-label">Standard tuning</p>${card(std, -1, true)}</div>
              <div class="fb-arrow">→</div>
              <div><p class="tool-label">Your tuning</p>${card(voicings[0], -1, true)}</div>
            </div>
            <p class="hint">${same ? "The easiest shape is the same in both tunings." :
              "Same chord, same notes — but because the open strings changed, your fingers go to different frets. Compare the two shapes string by string."}</p>
          </div>`;
      }
    }

    box.innerHTML = `
      <div class="panel">
        <h2>${voicings.length} shape${voicings.length === 1 ? "" : "s"} for ${name} in this tuning <small>(tap to see it on the neck and hear it · “/X” = X is the lowest note)</small></h2>
        ${voicings.length ? `<div class="diagrams big">${voicings.map((v, i) => card(v, i)).join("")}</div>`
          : `<p class="hint">No comfortable shape found (max 4 fingers, max 4 frets wide). Try another tuning or chord.</p>`}
      </div>
      ${compare}`;
    box.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
      st.voicing = Number(b.dataset.v); st.custom = null; st.activeString = null;
      drawFretboard(); drawVoicings();
      playVoicing(voicings[st.voicing]);
    });
  }

  /*
   * Tap a fret. If the note belongs to the chord/scale, it becomes that
   * string's note in YOUR shape (tap it again to mute the string), and all the
   * other options on that string light up. Otherwise the note just glows
   * everywhere it appears on the neck.
   */
  function tapCell(s, f) {
    const m = st.tuning[s] + f;
    const a = activeSet();
    if (!a || !a.pcs.includes(pc(m))) return tapNote(m);
    GuitarAudio.playMidi(m);
    const sugg = st.mode === "chord" && voicings[st.voicing];
    const shape = st.custom ? [...st.custom] : sugg ? [...sugg.frets] : [-1, -1, -1, -1, -1, -1];
    if (st.activeString === s) {
      // Choosing among the highlighted options: the tapped note replaces the
      // old one and the options close (chosen note solid, the rest faded).
      shape[s] = f;
      st.activeString = null;
    } else {
      // First tap on this string: select the note and show the other options.
      shape[s] = f;
      st.activeString = s;
    }
    st.custom = shape;
    st.focus = null;
    drawFretboard(); drawShapeInfo(); drawFocus();
    if (st.mode === "chord") drawVoicings();
  }

  function drawShapeInfo() {
    const box = $("#shapeInfo");
    const a = activeSet();
    if (!a) { box.innerHTML = ""; return; }
    if (!st.custom) {
      box.innerHTML = `<p class="hint fb-edit-hint">✎ Tap a ${st.mode} note to build your own shape — the other ${st.mode} notes on that string light up; tap one to swap it in.</p>`;
      return;
    }
    const frets = st.custom;
    const played = frets.map((f, s) => (f >= 0 ? s : -1)).filter(s => s >= 0);
    const midis = played.map(s => st.tuning[s] + frets[s]);
    const plan = autoFingering(frets);
    const fretted = frets.filter(f => f > 0);
    const span = fretted.length ? Math.max(...fretted) - Math.min(...fretted) + 1 : 0;
    const det = played.length >= 2 ? detectChord(midis) : null;
    let name = "";
    if (det) {
      const sp = spellSet(det.root, det.type.iv, true);
      const bass = pc(midis[0]);
      name = sp.get(det.root) + det.type.id + (bass !== det.root ? "/" + (sp.get(bass) || noteName(bass, false)) : "");
    }
    const warns = [];
    if (plan.count > 4) warns.push(`needs ${plan.count} fingers — you only have 4`);
    if (span > 4) warns.push(`stretches over ${span} frets`);
    if (played.length && frets.slice(played[0], played[played.length - 1] + 1).some(f => f < 0)) warns.push("a muted string sits between played strings (hard to strum)");
    if (st.mode === "chord") {
      const present = new Set(midis.map(pc));
      const miss = a.pcs.filter(p => !present.has(p)).map(p => a.nm(p));
      if (miss.length) warns.push(`missing ${miss.join(", ")}`);
    }
    box.innerHTML = `
      <div class="fb-shape-info">
        <span>✎ <strong>Your shape</strong> <code>${fretsText(frets)}</code>
          ${name ? `→ <strong class="chord-name">${name}</strong>` : played.length >= 2 ? "→ not a standard chord" : ""}
          · notes: ${midis.map(m => nameIn(a, m)).join(" ")}
          · ${plan.count} finger${plan.count === 1 ? "" : "s"}${plan.barres.length ? ` (${plan.barres.length === 1 ? "one presses" : plan.barres.length + " press"} several notes)` : ""}</span>
        ${warns.length ? `<span class="warn">⚠ ${warns.join(" · ")}</span>` : `<span class="ok">✓ Playable with ${plan.count} finger${plan.count === 1 ? "" : "s"}</span>`}
        <span class="fb-shape-btns">
          ${st.activeString !== null ? `<button class="btn small" id="muteString">✕ Mute ${["6th", "5th", "4th", "3rd", "2nd", "1st"][st.activeString]} string</button>` : ""}
          <button class="btn small" id="playShape">▶ Play</button>
          <button class="btn small" id="clearShape">${st.mode === "chord" ? "↺ Back to suggested shape" : "Clear shape"}</button>
        </span>
      </div>`;
    if ($("#muteString")) $("#muteString").onclick = () => {
      const shape = [...st.custom];
      shape[st.activeString] = -1;
      st.custom = shape.every(x => x === -1) ? null : shape;
      st.activeString = null;
      drawFretboard(); drawShapeInfo(); if (st.mode === "chord") drawVoicings();
    };
    $("#playShape").onclick = () => GuitarAudio.strumMidis(frets.map((f, s) => (f < 0 ? null : st.tuning[s] + f)));
    $("#clearShape").onclick = () => {
      st.custom = null; st.activeString = null;
      drawFretboard(); drawShapeInfo(); if (st.mode === "chord") drawVoicings();
    };
  }

  // Tap a note: hear it and highlight every place it lives on the neck.
  function tapNote(m) {
    GuitarAudio.playMidi(m);
    st.focus = st.focus && st.focus.midi === m ? null : { pc: pc(m), midi: m };
    drawFretboard(); drawFocus();
    if (st.mode !== "notes") drawPickers();
  }

  function drawFocus() {
    const box = $("#focusInfo");
    if (!st.focus) { box.innerHTML = `<span class="hint">Tap any note to hear it and see everywhere it appears on the neck.</span>`; return; }
    const a = activeSet();
    const flats = a ? a.flats : false;
    const name = nameIn(a, st.focus.pc);
    const ordinal = s => ["6th", "5th", "4th", "3rd", "2nd", "1st"][s];
    let all = 0;
    const same = [];
    st.tuning.forEach((open, s) => {
      for (let f = 0; f <= FRETS; f++) {
        if (pc(open + f) === st.focus.pc) all++;
        if (st.focus.midi !== null && open + f === st.focus.midi) same.push(`${ordinal(s)} string ${f === 0 ? "open" : "fret " + f}`);
      }
    });
    let role = "";
    if (a && a.pcs.includes(st.focus.pc)) {
      const i = pc(st.focus.pc - a.root);
      role = ` It is the <strong>${i === 0 ? "root (R)" : a.names[i]}</strong> of ${st.mode === "chord" ? "this chord" : "this scale"}.`;
    } else if (a) role = ` It is <em>not</em> in this ${st.mode}.`;
    box.innerHTML = `
      <span><span class="fb-dot focus focus-exact inline">${name}</span>
      ${st.focus.midi !== null
        ? `<strong>${name}${Math.floor(st.focus.midi / 12) - 1}</strong> (${GuitarAudio.midiFreq(st.focus.midi).toFixed(1)} Hz) — the exact same pitch is at: ${same.join(", ")}.`
        : `All <strong>${name}</strong> notes.`}
      ${all} ${name} spots on this neck (different octaves are glowing).${role}</span>
      <button class="btn small" id="clearFocus">Clear</button>`;
    $("#clearFocus").onclick = () => { st.focus = null; drawFretboard(); drawFocus(); if (st.mode !== "notes") drawPickers(); };
  }

  // Shape chooser: where the hand sits for each position of the scale.
  function shapesHTML(a) {
    const pat = scalePattern(a);
    if (!pat || !pat.shapes) return "";
    const sel = pat.shape;
    const startNote = a.nm(pc(a.root + sel.degree));
    const idx = a.names[sel.degree] || "R";
    return `<div class="fb-pos"><span class="tool-label">Shape</span>
      <button class="chip" data-shape="prev" aria-label="Previous shape">◀</button>
      ${pat.shapes.map((sh, i) => `<button class="chip ${sh === sel ? "on" : ""}" data-shape="${i}">${sh.n} <small>fr ${sh.lo}–${sh.hi}</small></button>`).join("")}
      <button class="chip" data-shape="next" aria-label="Next shape">▶</button></div>
      <p class="hint">✋ <strong>Shape ${sel.n}</strong>: hand on frets <strong>${sel.lo}–${sel.hi}</strong>, index finger on fret <strong>${Math.max(1, sel.anchor <= 1 ? 1 : sel.lo)}</strong>.
        It starts on <strong>${startNote}</strong> (the ${idx}) on the 6th string. The highlighted band is your hand; the faded notes belong to the other shapes —
        each shape shares notes with the next one, which is how they link up along the neck.</p>`;
  }

  function positionsHTML() {
    const cur = scalePos();
    return `<div class="fb-pos"><span class="tool-label">${st.scaleView === "all" ? "Hand position" : "Start position"}</span>
      <button class="chip" data-pos="prev" aria-label="Previous position">◀</button>
      ${Array.from({ length: 13 }, (_, i) => `<button class="chip ${i === cur ? "on" : ""}" data-pos="${i}">${i === 0 ? "Open" : i}</button>`).join("")}
      <button class="chip" data-pos="next" aria-label="Next position">▶</button></div>
      <p class="hint">${st.scaleView === "all"
        ? `One finger per fret: finger 1 on fret ${cur === 0 ? "1" : cur}, finger 2 on the next fret, and so on. Only the notes your hand reaches here are numbered.`
        : st.scaleView === "octave"
          ? `One octave from the first root on the 6th string at or after fret ${cur}.`
          : `The pattern starts on the first scale note on the 6th string at or after fret ${cur}. Move it to learn every position of the scale.`}</p>`;
  }

  // Diatonic chords: stack every other note of a 7-note scale (1-3-5, 2-4-6, …).
  function scaleChordsHTML(a) {
    const sorted = [...a.iv].sort((x, y) => x - y);
    if (sorted.length !== 7) return "";
    const roman = ["I", "II", "III", "IV", "V", "VI", "VII"];
    const chips = sorted.map((iv, k) => {
      const third = (sorted[(k + 2) % 7] - iv + 12) % 12;
      const fifth = (sorted[(k + 4) % 7] - iv + 12) % 12;
      const type = CHORD_TYPES.find(t => t.iv.length === 3 && t.iv[1] === third && t.iv[2] === fifth);
      if (!type) return "";
      const r = pc(a.root + iv);
      const numeral = type.id === "m" || type.id === "dim" ? roman[k].toLowerCase() : roman[k];
      return `<button class="chip" data-goto-chord="${r}|${type.id}"><small>${numeral}${type.id === "dim" ? "°" : ""}</small> ${a.nm(r)}${type.id}</button>`;
    }).join("");
    return `<p class="tool-label fb-sub">Chords in this scale <span class="hint">(tap to open)</span></p><div class="chips">${chips}</div>`;
  }

  function drawAll() {
    if (st.mode === "chord") voicings = findVoicings(st.tuning, st.chordRoot, chordType().iv);
    else voicings = [];
    if (st.voicing >= voicings.length) st.voicing = 0;
    drawTuningInfo(); drawPickers(); drawFretboard(); drawShapeInfo(); drawFocus(); drawLegend(); drawVoicings();
    document.querySelectorAll("[data-labels]").forEach(b => b.classList.toggle("on", b.dataset.labels === st.labels));
    $("#fingersChip").hidden = st.mode === "notes";
    $("#showAll").checked = st.showAll;
    $("#fbLefty").checked = prefs.lefty;
  }

  function retune(s, delta) {
    const target = st.tuning[s] + delta;
    const lo = STANDARD_TUNING[s] - 12, hi = STANDARD_TUNING[s] + 7;
    st.tuning[s] = Math.max(lo, Math.min(hi, target));
    st.voicing = 0; st.custom = null; st.activeString = null; save(); drawAll();
    GuitarAudio.playMidi(st.tuning[s]);
  }

  /* ----- Events ----- */
  $("#preset").onchange = e => {
    const p = TUNING_PRESETS.find(x => x.id === e.target.value);
    if (!p) return;
    st.tuning = [...p.notes]; st.voicing = 0; st.custom = null; st.activeString = null; save(); drawAll();
    GuitarAudio.strumMidis(st.tuning);
  };
  const toStandard = () => { st.tuning = [...STANDARD_TUNING]; st.voicing = 0; st.custom = null; st.activeString = null; save(); drawAll(); GuitarAudio.strumMidis(st.tuning); };
  $("#resetTuning").onclick = toStandard;
  $("#stdBtn").onclick = toStandard;
  $("#strumOpen").onclick = () => GuitarAudio.strumMidis(st.tuning);
  document.querySelectorAll(".fb-modes .tab").forEach(t => t.onclick = () => { st.mode = t.dataset.mode; st.voicing = 0; st.custom = null; st.activeString = null; save(); drawAll(); });
  document.querySelectorAll("[data-labels]").forEach(b => b.onclick = () => { st.labels = b.dataset.labels; save(); drawAll(); });
  $("#showAll").onchange = e => { st.showAll = e.target.checked; save(); drawAll(); };
  $("#fbLefty").onchange = e => { prefs.lefty = e.target.checked; store.set("lefty", prefs.lefty); drawAll(); };

  const fb = $("#fb");
  fb.addEventListener("click", e => {
    const t = e.target.closest("[data-tune]");
    if (t) return retune(Number(t.dataset.s), Number(t.dataset.tune));
    const o = e.target.closest("[data-open]");
    if (o) tapNote(st.tuning[Number(o.dataset.open)]);
  });

  /*
   * Drag a string sideways to retune it. Moving the notes one fret to the RIGHT
   * means every note now needs one more fret → the string was tuned DOWN a semitone.
   */
  let drag = null;
  fb.addEventListener("pointerdown", e => {
    const strings = e.target.closest(".fb-row:not(.markers) .fb-strings");
    if (!strings) return;
    const row = strings.parentElement;
    const cell = strings.querySelector(".fb-cell:not(.open)");
    drag = { row, s: Number(row.dataset.s), x0: e.clientX, dx: 0, moved: false, width: cell.getBoundingClientRect().width, target: e.target, id: e.pointerId };
  });
  fb.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(drag.dx) > 6) {
      drag.moved = true;
      drag.row.classList.add("dragging");
      try { drag.row.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    }
    if (drag.moved) {
      const dir = prefs.lefty ? -1 : 1;
      const steps = Math.round(drag.dx / drag.width) * dir;
      drag.row.style.setProperty("--dx", drag.dx + "px");
      const preview = st.tuning[drag.s] - steps;
      drag.row.querySelector(".fb-note").innerHTML = midiName(preview, false) +
        (steps ? `<em>${steps > 0 ? "−" : "+"}${Math.abs(steps)}</em>` : "");
    }
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    d.row.classList.remove("dragging");
    d.row.style.removeProperty("--dx");
    if (d.moved) {
      const dir = prefs.lefty ? -1 : 1;
      const steps = Math.round(d.dx / d.width) * dir;
      if (steps) retune(d.s, -steps); else drawFretboard();
    } else if (e.type === "pointerup") {
      const cell = d.target.closest(".fb-cell");
      if (cell) tapCell(d.s, Number(cell.dataset.f));
    }
  };
  fb.addEventListener("pointerup", endDrag);
  fb.addEventListener("pointercancel", endDrag);

  // Full screen (where supported) + try to lock landscape on phones.
  const stage = $("#stage");
  if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
    $("#fullBtn").hidden = false;
    $("#fullBtn").onclick = async () => {
      try {
        if (document.fullscreenElement) { await document.exitFullscreen(); return; }
        await (stage.requestFullscreen ? stage.requestFullscreen() : stage.webkitRequestFullscreen());
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape").catch(() => {});
      } catch { /* not allowed — ignore */ }
    };
  }
  // When the phone turns sideways, bring the whole neck into view.
  const landscape = window.matchMedia("(orientation: landscape) and (max-height: 540px)");
  const onRotate = () => { if (landscape.matches) setTimeout(() => stage.scrollIntoView({ block: "start", behavior: "smooth" }), 250); };
  landscape.addEventListener("change", onRotate);
  cleanup = () => landscape.removeEventListener("change", onRotate);

  drawAll();
}
