<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cifra Online — Beatles chords for beginners</title>
  <meta name="description" content="Easy acoustic guitar chord charts for Beatles songs: diagrams, strumming patterns, transpose and capo.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
  <style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --text: #1f2328;
  --muted: #667085;
  --border: #e4e2dc;
  --accent: #0f766e;
  --accent-soft: #e0f2ef;
  --chord: #c2410c;
  --chord-soft: #fff1e8;
  --top: #134e4a;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111416;
    --surface: #1a1f22;
    --text: #e8eaeb;
    --muted: #98a2ab;
    --border: #2b3236;
    --accent: #2dd4bf;
    --accent-soft: #123a36;
    --chord: #fb923c;
    --chord-soft: #3a2418;
    --top: #0b2b29;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
a { color: var(--accent); }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: .2em 0; line-height: 1.15; }
h2 { font-size: 1.15rem; margin: 1.4em 0 .6em; }
code { background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; }

.container { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }

/* Top bar */
.topbar { background: var(--top); color: #fff; position: sticky; top: 0; z-index: 10; }
.topbar-inner { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.logo { color: #fff; text-decoration: none; font-size: 1.3rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.logo b { color: #5eead4; }
.logo-mark { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #5eead4; color: var(--top); font-weight: 700; }
.nav { display: flex; gap: 4px; }
.nav a { color: #d1fae5; text-decoration: none; padding: 6px 12px; border-radius: 999px; font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.1); }
.nav a.active { background: #fff; color: var(--top); }

/* Hero / home */
.hero { background: linear-gradient(135deg, var(--accent-soft), transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 20px; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; color: var(--muted); margin: 0; }
.lead { color: var(--muted); font-size: 1.05rem; max-width: 60ch; }
.stats { margin: 0; }

.filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
#search { width: 100%; padding: 12px 14px; font-size: 1rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
#search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: .9rem; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.song-list { display: grid; gap: 10px; }
.song-card { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; text-decoration: none; color: inherit; box-shadow: var(--shadow); transition: transform .1s, border-color .1s; }
.song-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.rank { font-size: 1.4rem; font-weight: 700; color: var(--muted); width: 1.6em; text-align: center; flex: none; }
.song-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.song-title { font-weight: 650; font-size: 1.1rem; }
.song-meta { color: var(--muted); font-size: .9rem; }
.star { color: #eab308; }
.chord-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: .78rem; font-weight: 600; color: var(--chord); background: var(--chord-soft); padding: 1px 8px; border-radius: 6px; }
.empty { color: var(--muted); text-align: center; padding: 40px; }

.level { display: inline-flex; align-items: center; gap: 3px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
.level i { width: 8px; height: 8px; border-radius: 50%; background: var(--border); display: inline-block; }
.level i.on { background: var(--accent); }
.level span { margin-left: 4px; }

/* Song page */
.crumbs { font-size: .9rem; color: var(--muted); }
.crumbs a { text-decoration: none; }
.song-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
.song-artist { margin: 0; color: var(--muted); font-size: 1.05rem; }
.song-facts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; color: var(--muted); font-size: .9rem; margin: 8px 0 0; }
.icon-btn { font-size: 1.6rem; background: none; border: 1px solid var(--border); border-radius: 50%; width: 48px; height: 48px; cursor: pointer; color: var(--border); flex: none; }
.icon-btn.on { color: #eab308; border-color: #eab308; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; position: sticky; top: 56px; z-index: 5; box-shadow: var(--shadow); }
.tool { display: flex; align-items: center; gap: 6px; }
.tool-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.key-name { min-width: 3.2em; text-align: center; color: var(--chord); font-size: 1.05rem; }
.btn { font: inherit; font-size: .9rem; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); padding: 10px 18px; }
.btn.small { padding: 4px 10px; font-size: .85rem; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: .9rem; cursor: pointer; }
#speed { width: 90px; accent-color: var(--accent); }

.sounding { color: var(--muted); margin: 14px 2px; }
.sounding strong { color: var(--text); }
.callout { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; }

.song-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 860px) {
  .song-layout { grid-template-columns: 1fr; }
  .sidebar { order: -1; }
  .toolbar { position: static; }
}

.sheet { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 22px 22px; box-shadow: var(--shadow); }
.section h3 { font-size: .8em; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 1.4em 0 .5em; display: flex; align-items: center; gap: 8px; }
.repeat { font-size: .85em; background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 999px; letter-spacing: 0; font-weight: 700; }
.bars { display: flex; flex-wrap: wrap; margin-bottom: 8px; border-left: 3px solid var(--text); }
.bar { flex: 1 0 5.5em; display: flex; gap: .4em; align-items: center; padding: .45em .6em; border-right: 1px solid var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 2.6em; }
.bars .bar:last-child { border-right: 3px solid var(--text); }
.chord { font: inherit; font-weight: 700; color: var(--chord); background: none; border: none; padding: 2px 4px; border-radius: 6px; cursor: pointer; }
.chord:hover { background: var(--chord-soft); }
.flash { animation: flash .5s; }
@keyframes flash { from { background: var(--chord); color: #fff; } to { background: transparent; } }
.note { font-size: .8em; color: var(--muted); font-style: italic; margin: 4px 0 0; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 16px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.panel h2 small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.diagrams { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.diagrams.big { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.diagram-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 6px 4px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: var(--text); font: inherit; }
.diagram-card:hover { border-color: var(--chord); }
.diagram-card.static { cursor: default; width: 130px; flex: none; }
.diagram-card small { color: var(--muted); font-size: .72rem; padding-bottom: 4px; text-align: center; }
.diagram-name { font-weight: 700; color: var(--chord); }
.diagram { width: 100%; max-width: 120px; }
.diagram .fret, .diagram .string { stroke: var(--muted); stroke-width: 1; }
.diagram .nut { fill: var(--text); }
.diagram .dot { fill: var(--text); }
.diagram .finger { fill: var(--surface); font-size: 9px; font-weight: 700; }
.diagram .open { fill: none; stroke: var(--text); stroke-width: 1.3; }
.diagram .mute { fill: var(--muted); font-size: 12px; }
.diagram .fret-label { fill: var(--muted); font-size: 10px; }

.strum { display: flex; gap: 4px; margin-bottom: 10px; }
.beat { flex: 1; display: flex; flex-direction: column; align-items: center; background: var(--bg); border-radius: 8px; padding: 6px 0; border: 1px solid var(--border); }
.beat b { font-size: 1.3rem; color: var(--chord); line-height: 1; }
.beat.rest b { color: var(--border); }
.beat small { color: var(--muted); font-size: .75rem; }
.beat.now { background: var(--chord-soft); border-color: var(--chord); }
.hint { font-size: .85rem; color: var(--muted); }
.tips { padding-left: 18px; margin: 0; font-size: .92rem; }
.tips li { margin-bottom: 8px; }
.copyright { text-align: center; }

/* Chords & learn */
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: .9rem; color: var(--muted); }
.legend b { display: inline-block; vertical-align: middle; margin-right: 4px; }
.dot-sample { width: 12px; height: 12px; border-radius: 50%; background: var(--text); }
.open-sample { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--text); }

.learn-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 22px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.learn-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.tuner { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
@media (max-width: 520px) { .tuner { grid-template-columns: repeat(3, 1fr); } }
.string-btn { font: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 4px; cursor: pointer; color: var(--text); display: flex; flex-direction: column; align-items: center; }
.string-btn:hover { border-color: var(--accent); }
.string-btn b { font-size: 1.4rem; color: var(--accent); }
.string-btn small { color: var(--muted); }
.bars.demo { max-width: 400px; font-size: 18px; }

.footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 24px 16px; border-top: 1px solid var(--border); }

@media print {
  .topbar, .toolbar, .footer, .crumbs, .icon-btn, #playStrum, .copyright { display: none !important; }
  body { background: #fff; color: #000; }
  .song-layout { grid-template-columns: 1fr 220px; }
  .sheet, .panel { box-shadow: none; border: none; }
}

/* View tabs + "My lyrics sheet" */
.view-tabs { display: flex; gap: 4px; margin: 4px 0 12px; border-bottom: 1px solid var(--border); }
.tab { font: inherit; background: none; border: none; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--muted); font-weight: 600; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.my-text { width: 100%; min-height: 420px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; line-height: 1.6; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical; }
.edit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.edit-actions.top { justify-content: flex-end; margin: 10px 0 0; }
.btn.danger { color: #dc2626; }
.empty-mine { text-align: center; padding: 24px 8px; }
.cp-heading { font-size: .8em; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 1.4em 0 .4em; }
.cp-line { display: flex; flex-wrap: wrap; align-items: flex-end; margin-bottom: .3em; }
.cp-seg { display: inline-flex; flex-direction: column; }
.cp-chord { min-height: 1.5em; }
.cp-chord .chord { padding: 0 2px; margin-left: -2px; }
.cp-text { white-space: pre; }
.cp-gap { height: .8em; }
@media print { .view-tabs, .edit-actions { display: none !important; } }

</style>
</head>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/"><span class="logo-mark">♪</span> Cifra<b>Online</b></a>
      <nav class="nav">

  <main id="app" class="container"></main>

  <footer class="footer">
    <p>Cifra Online · Chord charts for learning purposes. Song lyrics are not reproduced.</p>
  </footer>

  <script>
/*
 * Song data.
 *
 * Lyrics are intentionally NOT included (they are copyrighted). Each song is
 * described by its chord progression, which is what a beginner needs to play
 * along with the recording.
 *
 * Format of a section line:
 *   "C | G | Am | F"   -> four bars, one chord per bar
 *   "G C | D"          -> first bar split between G and C, second bar D
 *
 * key          : the key of the chord SHAPES written below
 * capo         : recommended capo fret so the shapes match the recording
 * originalKey  : the key you hear on the record
 * strum        : 8 eighth-note slots ("1 & 2 & 3 & 4 &"); D = down, U = up, - = miss
 * level        : 1 = first weeks, 2 = a few months, 3 = stretch goal
 */
const SONGS = [
  {
    id: "let-it-be",
    title: "Let It Be",
    album: "Let It Be",
    year: 1970,
    key: "C",
    capo: 0,
    originalKey: "C",
    bpm: 72,
    level: 1,
    strum: "D-DU-UDU",
    tips: [
      "The whole song is built on four chords: C, G, Am and F. Learn the switch G → Am → F first.",
      "If the full F is hard, use the 'mini F' shown in the diagram (only four strings).",
      "Play slowly: one strum pattern per bar, two bars per vocal line."
    ],
    sections: [
      { name: "Intro", lines: ["C | G | Am | F", "C | G | F | C"] },
      { name: "Verse", lines: ["C | G | Am | F", "C | G | F | C"], repeat: 2 },
      { name: "Chorus", lines: ["Am | G | F | C", "C | G | F | C"] },
      { name: "Turnaround", lines: ["F Em | Dm C | Bb F | G F | C"], note: "Played after the chorus. Bb is optional — skip it and hold F if you're not ready." },
      { name: "Solo", lines: ["C | G | Am | F", "C | G | F | C"], note: "Same chords as the verse." },
      { name: "Outro", lines: ["Am | G | F | C", "C | G | F | C"] }
    ]
  },
  {
    id: "hey-jude",
    title: "Hey Jude",
    album: "Single",
    year: 1968,
    key: "C",
    capo: 5,
    originalKey: "F",
    bpm: 74,
    level: 1,
    strum: "D-DU-UDU",
    tips: [
      "Written here with easy C-shapes. Put a capo on fret 5 to sound exactly like the record (in F).",
      "The G → G7 change only moves one finger: lift your ring finger and put your index on the 1st fret of the high E string.",
      "The long 'na na na' ending is just three chords on repeat: C, Bb, F. Great practice for the Bb barre!"
    ],
    sections: [
      { name: "Verse", lines: ["C | G | G7 | C", "F | C | G7 | C"], repeat: 2 },
      { name: "Bridge", lines: ["C7 | F | Am | Dm", "G7 | C", "C7 | F | Am | Dm", "G7 | C | G | G7"] },
      { name: "Verse", lines: ["C | G | G7 | C", "F | C | G7 | C"] },
      { name: "Coda", lines: ["C | Bb | F | C"], repeat: 8, note: "Repeat as long as you like." }
    ]
  },
  {
    id: "love-me-do",
    title: "Love Me Do",
    album: "Please Please Me",
    year: 1962,
    key: "G",
    capo: 0,
    originalKey: "G",
    bpm: 74,
    level: 1,
    strum: "D-DU-UDU",
    tips: [
      "Only three chords: G, C and D. A perfect first Beatles song.",
      "Most bars switch between G and C every two beats — keep your ring finger anchored on the 3rd fret of the B string if you use the 4-finger G.",
      "The bridge (D → C → G) is where the harmonica solo happens."
    ],
    sections: [
      { name: "Intro", lines: ["G C | G C", "G C | G C"] },
      { name: "Verse", lines: ["G C | G C", "G C | C", "G C | G C"], repeat: 2 },
      { name: "Bridge", lines: ["D | C | G | G", "D | C | G | G"] },
      { name: "Verse", lines: ["G C | G C", "G C | C", "G C | G C"] },
      { name: "Solo", lines: ["D | C | G | G", "D | C | G | G"], note: "Harmonica solo over the bridge chords." },
      { name: "Outro", lines: ["G C | G C"], repeat: 3 }
    ]
  },
  {
    id: "twist-and-shout",
    title: "Twist and Shout",
    album: "Please Please Me",
    year: 1963,
    key: "D",
    capo: 0,
    originalKey: "D",
    bpm: 124,
    level: 1,
    strum: "D-DUDUDU",
    tips: [
      "Three chords, one loop: D → G → A. Once you have it, you have the whole song.",
      "It's fast! Practise the loop at half speed first, then speed up.",
      "In the famous build-up, just strum A and get louder each bar, ending on A7."
    ],
    sections: [
      { name: "Intro", lines: ["D G | A | D G | A"] },
      { name: "Verse", lines: ["D G | A | D G | A"], repeat: 4 },
      { name: "Build-up", lines: ["A | A | A | A7"], note: "Strum harder each bar — this is the 'aaah' section." },
      { name: "Verse", lines: ["D G | A | D G | A"], repeat: 4 },
      { name: "Ending", lines: ["D G | A | D"] }
    ]
  },
  {
    id: "yellow-submarine",
    title: "Yellow Submarine",
    album: "Revolver",
    year: 1966,
    key: "G",
    capo: 0,
    originalKey: "G",
    bpm: 110,
    level: 1,
    strum: "D-D-DUDU",
    tips: [
      "Verse lines start on D, not G — listen to the record to feel where it lands.",
      "The chorus is only G and D. Sing along, it helps keep time!",
      "Am and C are neighbours: keep your index and middle fingers in place and move only the ring finger."
    ],
    sections: [
      { name: "Verse", lines: ["D C | G | Em Am | C D", "D C | G | Em Am | C D"], repeat: 2 },
      { name: "Chorus", lines: ["G | D | D | G", "G | D | D | G"] },
      { name: "Verse", lines: ["D C | G | Em Am | C D", "D C | G | Em Am | C D"] },
      { name: "Chorus", lines: ["G | D | D | G", "G | D | D | G"], repeat: 2 }
    ]
  },
  {
    id: "eleanor-rigby",
    title: "Eleanor Rigby",
    album: "Revolver",
    year: 1966,
    key: "Em",
    capo: 0,
    originalKey: "Em",
    bpm: 136,
    level: 1,
    strum: "D-D-D-D-",
    tips: [
      "Just two chords: Em and C. The record has strings instead of guitars, so short, punchy down-strums sound great.",
      "Em → C: keep your middle finger on the A string, 2nd fret, and slide it to the 3rd fret.",
      "This is in a MINOR key (Em) — notice how it sounds darker than Let It Be."
    ],
    sections: [
      { name: "Intro", lines: ["C | C | Em | Em", "C | C | Em | Em"] },
      { name: "Verse", lines: ["Em | Em | Em | C", "C | C | Em | Em"], repeat: 2 },
      { name: "Chorus", lines: ["Em | Em | C | Em", "Em | Em | C | Em"] },
      { name: "Verse", lines: ["Em | Em | Em | C", "C | C | Em | Em"], repeat: 2 },
      { name: "Outro", lines: ["C | C | Em | Em"] }
    ]
  },
  {
    id: "come-together",
    title: "Come Together",
    album: "Abbey Road",
    year: 1969,
    key: "Dm",
    capo: 0,
    originalKey: "Dm",
    bpm: 82,
    level: 2,
    strum: "D-D-D-DU",
    tips: [
      "Verses sit on Dm for a long time — keep the groove relaxed and steady.",
      "Bm is shown as an easy 4-string version. Use it until you're ready for the full barre.",
      "The chorus (Bm → A → G) moves DOWN step by step — a sound worth remembering."
    ],
    sections: [
      { name: "Intro", lines: ["Dm | Dm | Dm | Dm"] },
      { name: "Verse", lines: ["Dm | Dm | Dm | Dm", "A | A", "G | A"], repeat: 2 },
      { name: "Chorus", lines: ["Bm | A | G | G"] },
      { name: "Verse", lines: ["Dm | Dm | Dm | Dm", "A | A", "G | A"], repeat: 2 },
      { name: "Chorus", lines: ["Bm | A | G | G"] },
      { name: "Outro", lines: ["Bm | A | G | G"], repeat: 4 }
    ]

  <script>
/*
 * Chord theory helpers: parsing, transposition, fingering lookup and
 * SVG chord diagrams.
 *
 * Fret arrays go from the LOW E string (6th) to the HIGH E string (1st).
 *   -1 = don't play the string (x), 0 = open string (o), n = press fret n
 * Finger numbers: 1 index, 2 middle, 3 ring, 4 pinky, 0 = none.
 */

const SHARPS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLATS = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

// Open-string pitches in Hz for standard tuning E2 A2 D3 G3 B3 E4.
const OPEN_STRINGS = [
  { name: "E", octave: 2, freq: 82.41 },
  { name: "A", octave: 2, freq: 110.0 },
  { name: "D", octave: 3, freq: 146.83 },
  { name: "G", octave: 3, freq: 196.0 },
  { name: "B", octave: 3, freq: 246.94 },
  { name: "E", octave: 4, freq: 329.63 }
];

// Beginner-friendly open shapes. `barre` = {fret, from, to} string indices.
const CHORD_LIBRARY = {
  // Major
  C:  { frets: [-1, 3, 2, 0, 1, 0], fingers: [0, 3, 2, 0, 1, 0] },
  D:  { frets: [-1, -1, 0, 2, 3, 2], fingers: [0, 0, 0, 1, 3, 2] },
  E:  { frets: [0, 2, 2, 1, 0, 0], fingers: [0, 2, 3, 1, 0, 0] },
  F:  { frets: [-1, -1, 3, 2, 1, 1], fingers: [0, 0, 3, 2, 1, 1], barre: { fret: 1, from: 4, to: 5 }, note: "Easy 'mini F' (4 strings)" },
  G:  { frets: [3, 2, 0, 0, 0, 3], fingers: [2, 1, 0, 0, 0, 3] },
  A:  { frets: [-1, 0, 2, 2, 2, 0], fingers: [0, 0, 1, 2, 3, 0] },
  Bb: { frets: [-1, 1, 3, 3, 3, 1], fingers: [0, 1, 3, 3, 3, 1], barre: { fret: 1, from: 1, to: 5 } },
  // Minor
  Am: { frets: [-1, 0, 2, 2, 1, 0], fingers: [0, 0, 2, 3, 1, 0] },
  Dm: { frets: [-1, -1, 0, 2, 3, 1], fingers: [0, 0, 0, 2, 3, 1] },
  Em: { frets: [0, 2, 2, 0, 0, 0], fingers: [0, 2, 3, 0, 0, 0] },
  Bm: { frets: [-1, -1, 4, 4, 3, 2], fingers: [0, 0, 3, 4, 2, 1], note: "Easy 4-string Bm" },
  // Sevenths
  A7: { frets: [-1, 0, 2, 0, 2, 0], fingers: [0, 0, 2, 0, 3, 0] },
  B7: { frets: [-1, 2, 1, 2, 0, 2], fingers: [0, 2, 1, 3, 0, 4] },
  C7: { frets: [-1, 3, 2, 3, 1, 0], fingers: [0, 3, 2, 4, 1, 0] },
  D7: { frets: [-1, -1, 0, 2, 1, 2], fingers: [0, 0, 0, 2, 1, 3] },
  E7: { frets: [0, 2, 0, 1, 0, 0], fingers: [0, 2, 0, 1, 0, 0] },
  G7: { frets: [3, 2, 0, 0, 0, 1], fingers: [3, 2, 0, 0, 0, 1] },
  // Minor sevenths
  Am7: { frets: [-1, 0, 2, 0, 1, 0], fingers: [0, 0, 2, 0, 1, 0] },
  Dm7: { frets: [-1, -1, 0, 2, 1, 1], fingers: [0, 0, 0, 2, 1, 1], barre: { fret: 1, from: 4, to: 5 } },
  Em7: { frets: [0, 2, 0, 0, 0, 0], fingers: [0, 2, 0, 0, 0, 0] },
  "F#m7": { frets: [-1, -1, 2, 2, 2, 2], fingers: [0, 0, 1, 1, 1, 1], barre: { fret: 2, from: 2, to: 5 }, note: "Easy 4-string F#m7" }
};

// Movable barre templates (relative to the barre fret).
const BARRE_SHAPES = {
  E: {
    rootString: 0, openRoot: 4, // E
    maj: { frets: [0, 2, 2, 1, 0, 0], fingers: [1, 3, 4, 2, 1, 1] },
    min: { frets: [0, 2, 2, 0, 0, 0], fingers: [1, 3, 4, 1, 1, 1] },
    "7": { frets: [0, 2, 0, 1, 0, 0], fingers: [1, 3, 1, 2, 1, 1] },
    m7: { frets: [0, 2, 0, 0, 0, 0], fingers: [1, 3, 1, 1, 1, 1] }
  },
  A: {
    rootString: 1, openRoot: 9, // A
    maj: { frets: [-1, 0, 2, 2, 2, 0], fingers: [0, 1, 3, 3, 3, 1] },
    min: { frets: [-1, 0, 2, 2, 1, 0], fingers: [0, 1, 3, 4, 2, 1] },
    "7": { frets: [-1, 0, 2, 0, 2, 0], fingers: [0, 1, 3, 1, 4, 1] },
    m7: { frets: [-1, 0, 2, 0, 1, 0], fingers: [0, 1, 3, 1, 2, 1] }
  }
};

function noteIndex(note) {
  let i = SHARPS.indexOf(note);
  if (i === -1) i = FLATS.indexOf(note);
  return i;
}

function parseChord(name) {
  const m = /^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/.exec(name.trim());
  if (!m) return null;
  return { root: m[1], suffix: m[2] || "", bass: m[3] || null };
}

// Keys that are conventionally written with flats.
const FLAT_KEYS = ["F", "Bb", "Eb", "Ab", "Db", "Gb", "Dm", "Gm", "Cm", "Fm", "Bbm", "Ebm"];

function transposeNote(note, semitones, useFlats) {
  const i = noteIndex(note);
  if (i === -1) return note;
  const j = ((i + semitones) % 12 + 12) % 12; // modulo that also works for negatives
  return (useFlats ? FLATS : SHARPS)[j];
}

function transposeKey(key, semitones) {
  const p = parseChord(key);
  if (!p) return key;
  // Choose spelling of the resulting key: try sharps, switch to flats if conventional.
  const sharpName = transposeNote(p.root, semitones, false) + p.suffix;
  const flatName = transposeNote(p.root, semitones, true) + p.suffix;
  return FLAT_KEYS.includes(flatName) ? flatName : sharpName;
}

function transposeChord(name, semitones, useFlats) {
  if (semitones === 0) return name;
  const p = parseChord(name);
  if (!p) return name;
  let out = transposeNote(p.root, semitones, useFlats) + p.suffix;
  if (p.bass) out += "/" + transposeNote(p.bass, semitones, useFlats);
  return out;
}

function keyUsesFlats(key) {
  return FLAT_KEYS.includes(key);
}

function quality(suffix) {
  if (suffix === "" || suffix.startsWith("maj") || suffix.startsWith("sus") || suffix === "6" || suffix === "add9") return "maj";
  if (suffix === "7" || suffix === "9") return "7";
  if (suffix === "m7") return "m7";
  if (suffix.startsWith("m") || suffix.startsWith("dim")) return "min";
  return "maj";
}

const SUFFIX_FOR_QUALITY = { maj: "", min: "m", "7": "7", m7: "m7" };

/*
 * Find a fingering for any chord name.
 * 1. Use the open-chord library (also trying the enharmonic spelling, e.g. A# = Bb).
 * 2. Otherwise build a movable barre chord on the E or A string, whichever is lower on the neck.
 */
function getFingering(name) {
  const p = parseChord(name);
  if (!p) return null;
  const base = p.root + p.suffix;
  if (CHORD_LIBRARY[base]) return { name: base, ...CHORD_LIBRARY[base] };

  const idx = noteIndex(p.root);
  const q = quality(p.suffix);
  const simple = SHARPS[idx] + SUFFIX_FOR_QUALITY[q];
  const simpleFlat = FLATS[idx] + SUFFIX_FOR_QUALITY[q];
  for (const n of [simple, simpleFlat]) {
    if (CHORD_LIBRARY[n]) return { name: n, ...CHORD_LIBRARY[n], simplified: SUFFIX_FOR_QUALITY[q] !== p.suffix };
  }

  let best = null;
  for (const shapeName of ["E", "A"]) {
    const shape = BARRE_SHAPES[shapeName];
    let fret = ((idx - shape.openRoot) % 12 + 12) % 12;
    if (fret === 0) fret = 12;
    if (!best || fret < best.fret) best = { shapeName, shape, fret };
  }
  const t = best.shape[q];
  const frets = t.frets.map(f => (f < 0 ? -1 : f + best.fret));
  const from = best.shape.rootString;
  return {
    name: simple,
    frets,
    fingers: t.fingers,
    barre: { fret: best.fret, from, to: 5 },
    note: `Barre chord (${best.shapeName}-shape, fret ${best.fret})`,
    simplified: SUFFIX_FOR_QUALITY[q] !== p.suffix
  };
}

/* ---------- SVG chord diagram ---------- */

function chordDiagramSVG(name, opts = {}) {
  const f = getFingering(name);
  if (!f) return "";
  const lefty = !!opts.lefty;
  const frets = lefty ? [...f.frets].reverse() : f.frets;
  const fingers = lefty ? [...f.fingers].reverse() : f.fingers;
  let barre = f.barre;
  if (barre && lefty) barre = { fret: barre.fret, from: 5 - barre.to, to: 5 - barre.from };

  const played = frets.filter(x => x > 0);
  const maxFret = played.length ? Math.max(...played) : 0;
  const minFret = played.length ? Math.min(...played) : 0;
  const startFret = maxFret > 4 ? minFret : 1; // window of 4 frets
  const nFrets = 4;

  const W = 110, H = 130;
  const left = 18, top = 30, gridW = 76, gridH = 84;
  const sx = gridW / 5, fy = gridH / nFrets;
  const x = s => left + s * sx;
  const y = fr => top + (fr - startFret + 0.5) * fy;

  let svg = `<svg class="diagram" viewBox="0 0 ${W} ${H}" role="img" aria-label="${name} chord diagram">`;
  // nut or start fret label
  if (startFret === 1) {
    svg += `<rect x="${left - 1}" y="${top - 4}" width="${gridW + 2}" height="4" class="nut"/>`;
  } else {
    svg += `<text x="${left - 6}" y="${top + fy * 0.5 + 4}" class="fret-label" text-anchor="end">${startFret}</text>`;
  }
  for (let i = 0; i <= nFrets; i++) svg += `<line x1="${left}" y1="${top + i * fy}" x2="${left + gridW}" y2="${top + i * fy}" class="fret"/>`;
  for (let s = 0; s < 6; s++) svg += `<line x1="${x(s)}" y1="${top}" x2="${x(s)}" y2="${top + gridH}" class="string"/>`;

  // open / muted markers
  frets.forEach((fr, s) => {
    if (fr === 0) svg += `<circle cx="${x(s)}" cy="${top - 12}" r="4" class="open"/>`;
    if (fr === -1) svg += `<text x="${x(s)}" y="${top - 8}" class="mute" text-anchor="middle">×</text>`;
  });

  if (barre) {
    svg += `<rect x="${x(barre.from) - 6}" y="${y(barre.fret) - 6}" width="${x(barre.to) - x(barre.from) + 12}" height="12" rx="6" class="dot"/>`;
  }
  frets.forEach((fr, s) => {
    if (fr > 0) {
      const onBarre = barre && fr === barre.fret && s >= barre.from && s <= barre.to;
      if (!onBarre) svg += `<circle cx="${x(s)}" cy="${y(fr)}" r="6.5" class="dot"/>`;
      if (fingers[s] && (!onBarre || s === barre.from)) {
        svg += `<text x="${x(s)}" y="${y(fr) + 3.5}" class="finger" text-anchor="middle">${fingers[s]}</text>`;
      }
    }
  });
  svg += `</svg>`;
  return svg;
}

  <script>
/*
 * Tiny guitar synthesiser using the Karplus–Strong algorithm.
 *
 * A plucked string is modelled as a short delay line filled with noise.
 * Each pass, neighbouring samples are averaged (a low-pass filter) and
 * slightly damped, so high frequencies die first — just like a real string.
 * The length of the delay line sets the pitch: N = sampleRate / frequency.
 *
 * Pitch of a fretted note: f = f_open × 2^(fret / 12)
 * (each fret raises the pitch by one semitone, and 12 semitones = double frequency).
 */
const GuitarAudio = (() => {
  let ctx = null;
  const cache = new Map();

  function context() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function pluckBuffer(freq) {
    const key = freq.toFixed(2);
    if (cache.has(key)) return cache.get(key);
    const c = context();
    const sr = c.sampleRate;
    const dur = 2.5;
    const buffer = c.createBuffer(1, Math.floor(sr * dur), sr);
    const data = buffer.getChannelData(0);
    const N = Math.max(2, Math.round(sr / freq));
    const ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    const decay = 0.996;
    for (let i = 0; i < data.length; i++) {
      const a = i % N, b = (i + 1) % N;
      data[i] = ring[a];
      ring[a] = decay * 0.5 * (ring[a] + ring[b]);
    }
    cache.set(key, buffer);
    return buffer;
  }

  function playFreq(freq, when = 0, gainValue = 0.35) {
    const c = context();
    const src = c.createBufferSource();
    src.buffer = pluckBuffer(freq);
    const g = c.createGain();
    g.gain.value = gainValue;
    src.connect(g).connect(c.destination);
    src.start(c.currentTime + when);
  }

  function fretFreq(stringIdx, fret, capo = 0) {
    return OPEN_STRINGS[stringIdx].freq * Math.pow(2, (fret + capo) / 12);
  }

  // Strum a chord: down = low→high, up = high→low.
  function strum(frets, { capo = 0, direction = "D", when = 0, spread = 0.03, gain = 0.3 } = {}) {
    const order = [0, 1, 2, 3, 4, 5];
    if (direction === "U") order.reverse();
    let k = 0;
    for (const s of order) {
      if (frets[s] < 0) continue;
      playFreq(fretFreq(s, frets[s], capo), when + k * spread, gain);
      k++;
    }
  }

  function playString(stringIdx) {
    playFreq(OPEN_STRINGS[stringIdx].freq, 0, 0.5);
  }

  // Play a strum pattern (8 eighth-note slots) once over a chord.
  function playPattern(frets, pattern, bpm, capo = 0) {
    const eighth = 60 / bpm / 2;
    [...pattern].forEach((slot, i) => {
      if (slot === "D" || slot === "U") {
        strum(frets, { capo, direction: slot, when: i * eighth, gain: slot === "U" ? 0.18 : 0.3, spread: 0.018 });
      }
    });
    return pattern.length * eighth;
  }

  return { strum, playString, playPattern };
})();

  <script>
/* Cifra Online — single-page app with hash routing. No build step needed. */

const $ = (sel, el = document) => el.querySelector(sel);
const app = $("#app");

const store = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem("cifra:" + key);
      return v === null ? fallback : JSON.parse(v);
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("cifra:" + key, JSON.stringify(value)); } catch { /* ignore */ }
  }
};

const LEVELS = { 1: "Beginner", 2: "Easy", 3: "Intermediate" };
const EASY_KEYS = ["C", "G", "D", "A", "E", "Am", "Em", "Dm"];

const prefs = {
  lefty: store.get("lefty", false),
  fontSize: store.get("fontSize", 18),
  showDiagrams: store.get("showDiagrams", true)
};

let scrollTimer = null;
function stopAutoScroll() {
  if (scrollTimer) cancelAnimationFrame(scrollTimer);
  scrollTimer = null;
}

/* ---------- Helpers ---------- */

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function songChords(song) {
  const set = [];
  song.sections.forEach(sec => sec.lines.forEach(line =>
    line.split("|").forEach(bar => bar.trim().split(/\s+/).forEach(ch => {
      if (ch && !set.includes(ch)) set.push(ch);
    }))
  ));
  return set;
}

function levelDots(level) {
  return `<span class="level level-${level}" title="${LEVELS[level]}">${[1, 2, 3].map(i => `<i class="${i <= level ? "on" : ""}"></i>`).join("")}<span>${LEVELS[level]}</span></span>`;
}

function favorites() { return store.get("favorites", []); }
function toggleFavorite(id) {
  const f = favorites();
  const i = f.indexOf(id);
  if (i === -1) f.push(id); else f.splice(i, 1);
  store.set("favorites", f);
  return i === -1;
}

function setActiveNav(route) {
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("active", a.dataset.route === route));
}

/* ---------- Home ---------- */

function renderHome() {
  setActiveNav("home");
  document.title = "The Beatles — Cifra Online";
  const query = store.get("query", "");
  const levelFilter = store.get("levelFilter", 0);
  const favOnly = store.get("favOnly", false);

  app.innerHTML = `
    <section class="hero">
      <div>
        <p class="eyebrow">Artist</p>
        <h1>${ARTIST.name}</h1>
        <p class="lead">${ARTIST.blurb}</p>
        <p class="stats"><strong>${SONGS.length}</strong> songs · chord charts, diagrams &amp; strumming patterns</p>
      </div>
    </section>

    <section class="filters">
      <input type="search" id="search" placeholder="Search a song or chord (e.g. “Hey Jude” or “Am”)" value="${escapeHtml(query)}" aria-label="Search songs">
      <div class="chips" role="group" aria-label="Difficulty">
        ${[[0, "All"], [1, "Beginner"], [2, "Easy"], [3, "Intermediate"]].map(([v, l]) =>
          `<button class="chip ${levelFilter === v ? "on" : ""}" data-level="${v}">${l}</button>`).join("")}
        <button class="chip ${favOnly ? "on" : ""}" id="favOnly">★ Favourites</button>
      </div>
    </section>

    <section id="songList" class="song-list"></section>
  `;

  const draw = () => {
    const q = store.get("query", "").trim().toLowerCase();
    const lv = store.get("levelFilter", 0);
    const fo = store.get("favOnly", false);
    const favs = favorites();
    const list = SONGS
      .filter(s => !lv || s.level === lv)
      .filter(s => !fo || favs.includes(s.id))
      .filter(s => {
        if (!q) return true;
        const chords = songChords(s).map(c => c.toLowerCase());
        return s.title.toLowerCase().includes(q) || s.album.toLowerCase().includes(q) || chords.includes(q);
      })
      .sort((a, b) => a.level - b.level || a.title.localeCompare(b.title));

    $("#songList").innerHTML = list.length ? list.map((s, i) => `
      <a class="song-card" href="#/song/${s.id}">
        <span class="rank">${i + 1}</span>
        <span class="song-main">
          <span class="song-title">${escapeHtml(s.title)} ${favs.includes(s.id) ? '<span class="star">★</span>' : ""}</span>
          <span class="song-meta">${escapeHtml(s.album)} · ${s.year} · Key ${s.key}${s.capo ? ` · Capo ${s.capo}` : ""}</span>
          <span class="chord-pills">${songChords(s).map(c => `<span class="pill">${c}</span>`).join("")}</span>
        </span>
        ${levelDots(s.level)}
      </a>`).join("") : `<p class="empty">No songs match. Try another search.</p>`;
  };

  $("#search").addEventListener("input", e => { store.set("query", e.target.value); draw(); });
  document.querySelectorAll(".chip[data-level]").forEach(btn => btn.addEventListener("click", () => {
    store.set("levelFilter", Number(btn.dataset.level));
    document.querySelectorAll(".chip[data-level]").forEach(b => b.classList.toggle("on", b === btn));
    draw();
  }));
  $("#favOnly").addEventListener("click", e => {
    const v = !store.get("favOnly", false);
    store.set("favOnly", v);
    e.currentTarget.classList.toggle("on", v);
    draw();
  });
  draw();
}

/* ---------- Song page ---------- */

function renderSong(id) {
  const song = SONGS.find(s => s.id === id);
  if (!song) return renderNotFound();
  setActiveNav("home");
  document.title = `${song.title} — ${ARTIST.name} — Cifra Online`;

  const saved = store.get("song:" + id, {});
  const state = {
    transpose: saved.transpose ?? 0,
    capo: saved.capo ?? song.capo,
    scrolling: false,
    speed: store.get("scrollSpeed", 3),
    view: store.get("view", "chart"),
    editing: false
  };
  const save = () => store.set("song:" + id, { transpose: state.transpose, capo: state.capo });

  app.innerHTML = `
    <nav class="crumbs"><a href="#/">${ARTIST.name}</a> › <span>${escapeHtml(song.title)}</span></nav>
    <header class="song-header">
      <div>
        <h1>${escapeHtml(song.title)}</h1>
        <p class="song-artist">${ARTIST.name} · <em>${escapeHtml(song.album)}</em> (${song.year})</p>
        <p class="song-facts">${levelDots(song.level)} <span>♩ = ${song.bpm}</span> <span>Record key: ${song.originalKey}</span></p>
      </div>
      <button class="icon-btn fav ${favorites().includes(id) ? "on" : ""}" id="favBtn" aria-label="Toggle favourite">★</button>
    </header>

    <div class="toolbar" id="toolbar">
      <div class="tool">
        <span class="tool-label">Key</span>
        <button class="btn" id="tDown" aria-label="Half step down">−½</button>
        <strong id="keyName" class="key-name"></strong>
        <button class="btn" id="tUp" aria-label="Half step up">+½</button>
      </div>
      <div class="tool">
        <span class="tool-label">Capo</span>
        <button class="btn" id="cDown" aria-label="Capo down">−</button>
        <strong id="capoVal" class="key-name"></strong>
        <button class="btn" id="cUp" aria-label="Capo up">+</button>
      </div>
      <button class="btn" id="easyBtn" title="Keep the same sound, but use the easiest chord shapes (with a capo)">Easy shapes</button>
      <button class="btn" id="resetBtn">Reset</button>
      <div class="tool">
        <span class="tool-label">Text</span>
        <button class="btn" id="fDown" aria-label="Smaller text">A−</button>
        <button class="btn" id="fUp" aria-label="Bigger text">A+</button>
      </div>
      <div class="tool">
        <button class="btn" id="scrollBtn">▶ Auto-scroll</button>
        <input type="range" id="speed" min="1" max="10" value="${state.speed}" aria-label="Scroll speed">
      </div>
      <label class="toggle"><input type="checkbox" id="diagToggle" ${prefs.showDiagrams ? "checked" : ""}> Diagrams</label>
      <label class="toggle"><input type="checkbox" id="leftyToggle" ${prefs.lefty ? "checked" : ""}> Left-handed</label>
      <button class="btn" onclick="window.print()">Print</button>
    </div>

    <p class="sounding" id="sounding"></p>
    ${song.tuning ? `<p class="callout">🎸 ${escapeHtml(song.tuning)}</p>` : ""}

    <div class="view-tabs" role="tablist">
      <button class="tab" data-view="chart" role="tab">Chord chart</button>
      <button class="tab" data-view="mine" role="tab">My lyrics sheet</button>
    </div>

    <div class="song-layout">
      <article class="sheet" id="sheet"></article>
      <aside class="sidebar">
        <section class="panel" id="diagramPanel">
          <h2>Chords <small>(tap to hear)</small></h2>
          <div class="diagrams" id="diagrams"></div>
        </section>
        <section class="panel">
          <h2>Strumming</h2>
          <div class="strum" id="strum"></div>
          <button class="btn small" id="playStrum">▶ Hear it</button>
          <p class="hint">Count “1 &amp; 2 &amp; 3 &amp; 4 &amp;”. Keep your hand moving down-up all the time — only touch the strings on the arrows.</p>
        </section>
        <section class="panel">
          <h2>Tips</h2>
          <ul class="tips">${song.tips.map(t => `<li>${escapeHtml(t)}</li>`).join("")}</ul>
        </section>
        <p class="hint copyright">Lyrics aren't shown for copyright reasons — play along with the recording.</p>
      </aside>
    </div>
  `;

  const shapesKey = () => transposeKey(song.key, state.transpose);
  const soundingKey = () => transposeKey(song.key, state.transpose + state.capo);
  const flats = () => keyUsesFlats(shapesKey());
  const chordName = c => transposeChord(c, state.transpose, flats());

  function drawSheet() {
    $("#keyName").textContent = shapesKey();
    $("#capoVal").textContent = state.capo === 0 ? "None" : state.capo;
    $("#sounding").innerHTML = state.capo
      ? `Play <strong>${shapesKey()}</strong> shapes with the capo on fret <strong>${state.capo}</strong> → sounds in <strong>${soundingKey()}</strong>.`
      : `Sounds in <strong>${soundingKey()}</strong> (no capo).`;

    const sheet = $("#sheet");
    sheet.style.fontSize = prefs.fontSize + "px";
    document.querySelectorAll(".view-tabs .tab").forEach(t => t.classList.toggle("on", t.dataset.view === state.view));
    if (state.view === "mine") drawMySheet(sheet);
    else sheet.innerHTML = song.sections.map(sec => `
      <section class="section">
        <h3>${escapeHtml(sec.name)} ${sec.repeat ? `<span class="repeat">×${sec.repeat}</span>` : ""}</h3>
        ${sec.lines.map(line => `
          <div class="bars">${line.split("|").map(bar => `
            <span class="bar">${bar.trim().split(/\s+/).map(c => {
              const n = chordName(c);
              return `<button class="chord" data-chord="${n}">${n}</button>`;
            }).join("")}</span>`).join("")}
          </div>`).join("")}
        ${sec.note ? `<p class="note">${escapeHtml(sec.note)}</p>` : ""}
      </section>`).join("");

    const chords = songChords(song).map(chordName);
    $("#diagramPanel").style.display = prefs.showDiagrams ? "" : "none";
    $("#diagrams").innerHTML = chords.map(c => {
      const f = getFingering(c);
      return `<button class="diagram-card" data-chord="${c}" title="${f && f.note ? escapeHtml(f.note) : c}">
        <span class="diagram-name">${c}${f && f.simplified ? "*" : ""}</span>
        ${chordDiagramSVG(c, { lefty: prefs.lefty })}
      </button>`;
    }).join("");

    $("#strum").innerHTML = ["1", "&", "2", "&", "3", "&", "4", "&"].map((count, i) => {
      const s = song.strum[i];
      const arrow = s === "D" ? "↓" : s === "U" ? "↑" : "·";
      return `<span class="beat ${s === "-" ? "rest" : ""}"><b>${arrow}</b><small>${count}</small></span>`;
    }).join("");
  }

  /* ----- "My lyrics sheet": user-supplied text, stored only in this browser ----- */

  // Skeleton built from the chart: section headings + chords, no words.
  function template() {
    return song.sections.map(sec =>
      `# ${sec.name}${sec.repeat ? ` (x${sec.repeat})` : ""}\n` +
      sec.lines.map(line => line.split("|").map(bar =>
        bar.trim().split(/\s+/).map(c => `[${c}]`).join(" ")).join("    ")).join("\n")
    ).join("\n\n");
  }

  // ChordPro-style rendering: "[C]some words [G]more words" → chords above the words.
  function renderChordPro(text) {
    const chordBtn = raw => {
      const n = parseChord(raw) ? chordName(raw) : raw;
      return `<button class="chord" data-chord="${escapeHtml(n)}">${escapeHtml(n)}</button>`;
    };
    return text.split("\n").map(line => {
      if (/^#/.test(line)) return `<h3 class="cp-heading">${escapeHtml(line.replace(/^#+\s*/, ""))}</h3>`;
      if (!line.trim()) return `<div class="cp-gap"></div>`;
      if (!/\[[^\]]+\]/.test(line)) return `<div class="cp-line"><span class="cp-text">${escapeHtml(line)}</span></div>`;
      const segs = [];
      let pending = null;
      for (const part of line.split(/(\[[^\]]+\])/)) {
        const m = /^\[([^\]]+)\]$/.exec(part);
        if (m) { if (pending !== null) segs.push({ chord: pending, text: "" }); pending = m[1]; }
        else if (part) { segs.push({ chord: pending, text: part }); pending = null; }
      }
      if (pending !== null) segs.push({ chord: pending, text: "" });
      return `<div class="cp-line">${segs.map(s => `<span class="cp-seg"><span class="cp-chord">${s.chord ? chordBtn(s.chord) : "&nbsp;"}</span><span class="cp-text">${escapeHtml(s.text) || "&nbsp;"}</span></span>`).join("")}</div>`;
    }).join("");
  }

  function drawMySheet(sheet) {
    const text = store.get("lyrics:" + id, "");
    if (state.editing) {
      sheet.innerHTML = `
        <p class="hint">Type or paste the words from your own copy (CD booklet, a licensed lyrics site…).
        Put a chord in square brackets right before the syllable where it changes, e.g. <code>[C]my words [G]here</code>.
        Lines starting with <code>#</code> are section titles. Saved only in this browser.</p>
        <textarea id="myText" class="my-text" spellcheck="false">${escapeHtml(text || template())}</textarea>
        <div class="edit-actions">
          <button class="btn primary" id="saveMine">Save</button>
          <button class="btn" id="cancelMine">Cancel</button>
          <button class="btn" id="resetMine">Start from chord skeleton</button>
          ${text ? `<button class="btn danger" id="deleteMine">Delete my sheet</button>` : ""}
        </div>`;
      $("#saveMine").onclick = () => { store.set("lyrics:" + id, $("#myText").value); state.editing = false; drawSheet(); };
      $("#cancelMine").onclick = () => { state.editing = false; drawSheet(); };
      $("#resetMine").onclick = () => { $("#myText").value = template(); };
      if ($("#deleteMine")) $("#deleteMine").onclick = () => {
        if (confirm("Delete your lyrics sheet for this song?")) { store.set("lyrics:" + id, ""); state.editing = false; drawSheet(); }
      };
      return;
    }
    sheet.innerHTML = text
      ? `<div class="edit-actions top"><button class="btn small" id="editMine">✎ Edit</button></div><div class="cp">${renderChordPro(text)}</div>`
      : `<div class="empty-mine">
           <p><strong>Build your own play-along sheet.</strong></p>
           <p class="hint">We can't publish the lyrics, but you can add the words from your own copy.
           We'll start you off with this song's sections and chords — you fill in the words, and the chords will sit right above them.</p>
           <p class="hint">Example: <code>[G]Walking down the [C]road today</code></p>
           <button class="btn primary" id="editMine">Create my sheet</button>
         </div>`;
    $("#editMine").onclick = () => { state.editing = true; drawSheet(); };
  }

  function playChord(name, direction = "D") {
    const f = getFingering(name);
    if (f) GuitarAudio.strum(f.frets, { capo: state.capo, direction });
    document.querySelectorAll(`[data-chord="${CSS.escape(name)}"]`).forEach(el => {
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    });
  }

  app.addEventListener("click", onSongClick);
  function onSongClick(e) {
    const btn = e.target.closest("[data-chord]");
    if (btn && app.contains(btn)) playChord(btn.dataset.chord);
  }
  cleanup = () => { app.removeEventListener("click", onSongClick); stopAutoScroll(); };

  document.querySelectorAll(".view-tabs .tab").forEach(t => t.onclick = () => {
    state.view = t.dataset.view; state.editing = false; store.set("view", state.view); drawSheet();
  });

  const update = () => { save(); drawSheet(); };
  $("#tUp").onclick = () => { state.transpose = (state.transpose + 1) % 12; update(); };
  $("#tDown").onclick = () => { state.transpose = (state.transpose + 11) % 12; update(); };
  $("#cUp").onclick = () => { if (state.capo < 11) { state.capo++; update(); } };
  $("#cDown").onclick = () => { if (state.capo > 0) { state.capo--; update(); } };
  $("#resetBtn").onclick = () => { state.transpose = 0; state.capo = song.capo; update(); };

  // Keep the sounding pitch the same, but find the lowest capo giving easy open shapes.
  $("#easyBtn").onclick = () => {
    const total = state.transpose + state.capo;
    for (let c = 0; c <= 9; c++) {
      const t = ((total - c) % 12 + 12) % 12;
      if (EASY_KEYS.includes(transposeKey(song.key, t))) {
        state.transpose = t; state.capo = c; update(); return;
      }
    }
  };

  $("#fUp").onclick = () => { prefs.fontSize = Math.min(30, prefs.fontSize + 2); store.set("fontSize", prefs.fontSize); drawSheet(); };
  $("#fDown").onclick = () => { prefs.fontSize = Math.max(12, prefs.fontSize - 2); store.set("fontSize", prefs.fontSize); drawSheet(); };
  $("#diagToggle").onchange = e => { prefs.showDiagrams = e.target.checked; store.set("showDiagrams", prefs.showDiagrams); drawSheet(); };
  $("#leftyToggle").onchange = e => { prefs.lefty = e.target.checked; store.set("lefty", prefs.lefty); drawSheet(); };
  $("#favBtn").onclick = e => e.currentTarget.classList.toggle("on", toggleFavorite(id));
  $("#speed").oninput = e => { state.speed = Number(e.target.value); store.set("scrollSpeed", state.speed); };

  $("#scrollBtn").onclick = () => {
    state.scrolling = !state.scrolling;
    $("#scrollBtn").textContent = state.scrolling ? "❚❚ Stop" : "▶ Auto-scroll";
    if (!state.scrolling) return stopAutoScroll();
    let acc = 0, last = performance.now();
    const step = now => {
      const dt = (now - last) / 1000; last = now;
      acc += dt * state.speed * 8; // pixels per second
      const px = Math.floor(acc);
      if (px > 0) { window.scrollBy(0, px); acc -= px; }
      if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
        state.scrolling = false; $("#scrollBtn").textContent = "▶ Auto-scroll"; return stopAutoScroll();
      }
      scrollTimer = requestAnimationFrame(step);
    };
    scrollTimer = requestAnimationFrame(step);
  };

  $("#playStrum").onclick = () => {
    const first = getFingering(chordName(songChords(song)[0]));
    if (!first) return;
    const beats = [...$("#strum").children];
    const eighth = 60 / song.bpm / 2;
    const total = GuitarAudio.playPattern(first.frets, song.strum, song.bpm, state.capo);
    beats.forEach((b, i) => setTimeout(() => {
      beats.forEach(x => x.classList.remove("now")); b.classList.add("now");
    }, i * eighth * 1000));
    setTimeout(() => beats.forEach(x => x.classList.remove("now")), total * 1000);
  };

  drawSheet();
}

/* ---------- Chord library ---------- */

function renderChords() {
  setActiveNav("chords");
  document.title = "Chord library — Cifra Online";
  const groups = {
    "Major": ["C", "D", "E", "F", "G", "A", "Bb"],
    "Minor": ["Am", "Bm", "Dm", "Em"],
    "Seventh (7)": ["A7", "B7", "C7", "D7", "E7", "G7"],
    "Minor seventh (m7)": ["Am7", "Dm7", "Em7", "F#m7"]
  };
  app.innerHTML = `
    <h1>Chord library</h1>
    <p class="lead">Every chord used on this site, in beginner-friendly shapes. Tap a chord to hear it.</p>
    <div class="legend">
      <span><b class="dot-sample"></b> press here (number = finger: 1 index, 2 middle, 3 ring, 4 pinky)</span>
      <span><b class="open-sample"></b> play the open string</span>
      <span><b>×</b> don't play this string</span>
    </div>
    ${Object.entries(groups).map(([g, list]) => `
      <h2>${g}</h2>
      <div class="diagrams big">${list.map(c => `
        <button class="diagram-card" data-chord="${c}">
          <span class="diagram-name">${c}</span>
          ${chordDiagramSVG(c, { lefty: prefs.lefty })}
          ${CHORD_LIBRARY[c].note ? `<small>${CHORD_LIBRARY[c].note}</small>` : ""}
        </button>`).join("")}
      </div>`).join("")}
  `;
  const onClick = e => {
    const b = e.target.closest("[data-chord]");
    if (b) GuitarAudio.strum(getFingering(b.dataset.chord).frets);
  };
  app.addEventListener("click", onClick);
  cleanup = () => app.removeEventListener("click", onClick);
}

/* ---------- Learn ---------- */

function renderLearn() {
  setActiveNav("learn");
  document.title = "Start here — Cifra Online";
  app.innerHTML = `
    <h1>Start here</h1>
    <p class="lead">Five things to know before your first song.</p>

    <section class="learn-card">
      <h2>1. Tune your guitar</h2>
      <p>Standard tuning, from the thickest string to the thinnest: <strong>E A D G B E</strong>. Tap a string to hear its reference note and tune until they match.</p>
      <div class="tuner">${OPEN_STRINGS.map((s, i) => `
        <button class="string-btn" data-string="${i}"><b>${s.name}<sub>${s.octave}</sub></b><small>${s.freq.toFixed(1)} Hz</small></button>`).join("")}
      </div>
      <p class="hint">Each string is 5 frets (semitones) above the previous one — except G→B, which is 4. That's why the 5th-fret tuning trick works.</p>
    </section>

    <section class="learn-card">
      <h2>2. Read a chord diagram</h2>
      <div class="learn-row">
        <div class="diagram-card static">${chordDiagramSVG("C")}</div>
        <ul>
          <li>Vertical lines are the <strong>strings</strong> (thick low E on the left).</li>
          <li>Horizontal lines are the <strong>frets</strong>; the thick bar at the top is the nut.</li>
          <li>Dots show where to press; the number is the <strong>finger</strong>.</li>
          <li><strong>○</strong> = play open, <strong>×</strong> = don't play.</li>
        </ul>
      </div>
    </section>

    <section class="learn-card">
      <h2>3. Read a chord chart</h2>
      <div class="bars demo"><span class="bar"><span class="chord">C</span></span><span class="bar"><span class="chord">G</span></span><span class="bar"><span class="chord">Am</span><span class="chord">F</span></span></div>
      <p>Each box is one <strong>bar</strong> (4 beats). Two chords in one box share it: 2 beats each. <span class="repeat">×2</span> means play the section twice.</p>
    </section>

    <section class="learn-card">
      <h2>4. Strumming</h2>
      <p>Count <strong>1 &amp; 2 &amp; 3 &amp; 4 &amp;</strong>. Your hand goes <strong>down on the numbers</strong> and <strong>up on the “&amp;”</strong> — always, like a pendulum. A pattern just tells you which swings actually hit the strings.</p>
      <p>Start with all down-strums (<code>↓ · ↓ · ↓ · ↓ ·</code>), then try the most common pattern in pop: <code>↓ · ↓ ↑ · ↑ ↓ ↑</code>.</p>
    </section>

    <section class="learn-card">
      <h2>5. Capo &amp; changing key</h2>
      <p>A capo clamps all strings at one fret — like a moveable nut. Each fret raises the pitch by one <strong>semitone</strong>, so you can play easy shapes (C, G, D…) and still match the record.</p>
      <p>On every song page, <strong>Key ±½</strong> changes the chord shapes, <strong>Capo ±</strong> moves the capo, and <strong>Easy shapes</strong> keeps the same sound but picks the simplest shapes for you.</p>
    </section>

    <p><a class="btn primary" href="#/song/love-me-do">Try your first song: Love Me Do →</a></p>
  `;
  const onClick = e => {
    const b = e.target.closest("[data-string]");
    if (b) GuitarAudio.playString(Number(b.dataset.string));
  };
  app.addEventListener("click", onClick);
  cleanup = () => app.removeEventListener("click", onClick);
}

function renderNotFound() {
  app.innerHTML = `<h1>Page not found</h1><p><a href="#/">Back to songs</a></p>`;
}

/* ---------- Router ---------- */

let cleanup = () => {};
function route() {
  cleanup(); cleanup = () => {};
  const hash = location.hash.replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);
  if (parts.length === 0) renderHome();
  else if (parts[0] === "song" && parts[1]) renderSong(parts[1]);
  else if (parts[0] === "chords") renderChords();
  else if (parts[0] === "learn") renderLearn();
  else renderNotFound();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();

</script>
